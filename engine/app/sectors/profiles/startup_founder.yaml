sector: startup_founder
display_name: Startup Founder
common_tools:
  - Linear
  - Notion
  - Slack
  - GitHub
  - Vercel
  - Supabase
  - Stripe Dashboard
  - PostHog
  - Mixpanel
  - Y Combinator Bookface
  - Anthropic Console
  - OpenAI Platform
  - Mercury
  - Brex
