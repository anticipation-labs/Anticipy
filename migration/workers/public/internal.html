/* ========================= HAND-ORDERING ================================= */
/* "Push them around my hand." Position is a float column on the server; a
   drop writes ONE task (the midpoint of its new neighbours), because the
   PATCH route mints activity and notification rows and the Railway volume
   has been filled by an over-chatty ledger once already. Tasks that were
   never hand-ordered carry position 0 and float to the top in default
   order, so new work is visible rather than buried under old decisions. */
function byHand(a, b){
  var pa = a.position || 0, pb = b.position || 0;
  if (pa && pb && pa !== pb) return pa - pb;
  if (pa && !pb) return 1;         // ordered tasks sit below the unordered new arrivals
  if (!pa && pb) return -1;
  return byDue(a, b);
}
function persistPosition(id, pos){
  // Quiet on purpose: no refresh churn mid-drag session; the poll catches up.
  return api("/internal/todos", { method:"PATCH", body:{ actor_id:S.me.id, todo_id:id, position: pos } })
    .catch(function(e){ fail(e); });
}
// A drop between two neighbours needs both to HAVE positions. The first drag
// adopts the whole visible list (one write per row, once ever); after that,
// every drag is a single write unless midpoints run out of room.
function adoptOrder(list){
  var chain = Promise.resolve();
  list.forEach(function(t, i){
    var pos = (i + 1) * 1000;
    if (Math.abs((t.position || 0) - pos) > 0.0001){
      t.position = pos;
      chain = chain.then(function(){ return persistPosition(t.id, pos); });
    }
  });
  return chain;
}
function attachDrag(rowEl, list, index, onReorder){
  var grip = el("button","grip");
  grip.setAttribute("aria-label","Drag to reorder");
  grip.innerHTML = '<svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor" aria-hidden="true">' +
    '<circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/>' +
    '<circle cx="2.5" cy="7" r="1.4"/><circle cx="7.5" cy="7" r="1.4"/>' +
    '<circle cx="2.5" cy="11.5" r="1.4"/><circle cx="7.5" cy="11.5" r="1.4"/></svg>';
  grip.onclick = function(e){ e.stopPropagation(); };
  grip.onpointerdown = function(e){
    e.preventDefault(); e.stopPropagation();
    var wrap = rowEl.parentElement;
    var rows = Array.prototype.slice.call(wrap.children);
    var startY = e.clientY;
    var moved = false;
    rowEl.classList.add("dragging");
    // Listeners live on the WINDOW, not the grip. The first version trusted
    // setPointerCapture to route every event back to the grip — real mice
    // honour that, but nothing obliges other input sources to, and the drop
    // handler silently never fired: the row moved on screen and NOTHING was
    // written. Window listeners hear the whole drag no matter where the
    // pointer wanders; capture stays as a best-effort extra for touch.
    try { grip.setPointerCapture(e.pointerId); } catch(_){}
    function targetIndex(clientY){
      var idx = 0;
      rows.forEach(function(r){
        if (r === rowEl) return;
        var box = r.getBoundingClientRect();
        if (clientY > box.top + box.height / 2) idx++;
      });
      return idx;
    }
    function onMove(ev){
      if (Math.abs(ev.clientY - startY) > 4) moved = true;
      if (!moved) return;
      rowEl.style.transform = "translateY(" + (ev.clientY - startY) + "px)";
      var idx = targetIndex(ev.clientY);
      var others = rows.filter(function(r){ return r !== rowEl; });
      var before = others[idx] || null;
      if (before !== rowEl.nextSibling || (!before && wrap.lastChild !== rowEl)){
        // Live DOM reorder gives the "pushing things aside" feel; transform is
        // reset because the row's own offset just changed with the move.
        wrap.insertBefore(rowEl, before);
        rows = Array.prototype.slice.call(wrap.children);
        startY = ev.clientY;
        rowEl.style.transform = "";
      }
    }
    function onUp(ev){
      try { grip.releasePointerCapture(ev.pointerId); } catch(_){}
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      rowEl.classList.remove("dragging");
      rowEl.style.transform = "";
      if (!moved) return;
      var finalIdx = Array.prototype.indexOf.call(wrap.children, rowEl);
      onReorder(index, finalIdx);
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };
  rowEl.insertBefore(grip, rowEl.firstChild);
}
function reorderMyTasks(list, fromIdx, toIdx){
  if (fromIdx === toIdx) return;
  var moved = list.splice(fromIdx, 1)[0];
  list.splice(toIdx, 0, moved);
  // Dragging is an implicit vote for "My order" — switching sorts under
  // someone's cursor and then ignoring where they dropped would be worse.
  S.ui.mtSort = "manual";
  try { localStorage.setItem("hq_mtsort", "manual"); } catch(_){}
  var allHave = list.every(function(t){ return (t.position || 0) > 0; });
  var finish = function(){
    var prev = toIdx > 0 ? (list[toIdx-1].position || 0) : 0;
    var next = toIdx < list.length - 1 ? (list[toIdx+1].position || 0) : (prev + 2000);
    var mid = prev + (next - prev) / 2;
    if (!(mid > prev && mid < next) || (next - prev) < 0.001){
      // Midpoints exhausted (or a zero snuck in): re-space everything once.
      return adoptOrder(list).then(render);
    }
    moved.position = mid;
    render();
    return persistPosition(moved.id, mid);
  };
  if (!allHave){
    // First-ever drag: adopt the visible order (with the move applied), then
    // every later drag is one write.
    adoptOrder(list).then(render);
  } else {
    finish();
  }
}

/* ========================= ONBOARDING ==================================== */
/* Four cards, shown once per person per browser, reopenable from the "?" in
   the header. It never blocks anything — Escape, the backdrop, and Skip all
   close it — and the flag is per person so Arav's first visit is still a
   first visit after Omar used the same laptop. */
function onboardKey(){ return "hq_onboarded_" + (S.me ? S.me.id : "anon"); }
function maybeOnboard(){
  var seen = null;
  try { seen = localStorage.getItem(onboardKey()); } catch(_){}
  if (!seen) showOnboarding(false);
}
function showOnboarding(manual){
  var name = S.me ? S.me.name : "there";
  var needsContact = S.me && (!S.me.email || !S.me.phone);
  var steps = [
    { t: "Welcome to HQ, " + name + ".",
      b: "This is the team's one home for who is doing what. Today — the first page — always answers a single question: what needs you right now. Overdue things, blocked things, things with no owner. When it says nothing needs you, that's allowed.",
      cta: null },
    { t: "Tasks belong to people.",
      b: "Hit + New Task, type the thing, and tap the names it belongs to — one person or several, anyone can assign anyone. Click any task to open it: due date, priority, steps, comments, all in one panel. Tick the circle when it's done.",
      cta: null },
    { t: "Projects, Calendar, and the bell.",
      b: "Projects splits the work into streams — Company, Growth, and friends. Calendar lays every deadline and event on a month. The bell fills up when someone assigns you something, finishes your task, or mentions you.",
      cta: null },
    { t: "Where can HQ reach you?",
      b: "Reminders arrive by email or text — but only if HQ knows where. Put yours in here once and you're done. (Everything else — how you like to be nudged, your sign-in code — lives in Settings.)",
      form: true,
      cta: { label: "Open Settings", go: function(){ closeModal(); nav("settings"); } } }
  ];
  var i = 0;
  function paint(){
    openModal(function(box){
      box.setAttribute("data-onboarding","1");
      var st = steps[i];
      var eyebrow = el("div","seclabel", (i+1) + " of " + steps.length);
      box.appendChild(eyebrow);
      box.appendChild(el("h3", null, st.t));
      var pp = el("p", null, st.b);
      pp.style.cssText = "margin:0 0 6px;font-size:14.5px;line-height:1.65;color:var(--ink-2)";
      box.appendChild(pp);
      var saveContact = null;
      if (st.form && S.me){
        var fwrap = el("div"); fwrap.style.cssText = "display:flex;flex-direction:column;gap:9px;margin:14px 0 2px";
        var fe = document.createElement("input");
        fe.type = "email"; fe.placeholder = "you@example.com"; fe.value = S.me.email || "";
        var fp = document.createElement("input");
        fp.type = "tel"; fp.placeholder = "+1 555 555 0100"; fp.value = S.me.phone || "";
        [fe, fp].forEach(function(inp){
          inp.style.cssText = "width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:14.5px";
        });
        fwrap.appendChild(el("div","seclabel","Email")); fwrap.appendChild(fe);
        fwrap.appendChild(el("div","seclabel","Phone")); fwrap.appendChild(fp);
        box.appendChild(fwrap);
        saveContact = function(){
          var em = fe.value.trim(), phn = fp.value.trim();
          if (em === (S.me.email||"") && phn === (S.me.phone||"")) return Promise.resolve();
          return api("/internal/people", { method:"PATCH",
            body:{ actor_id:S.me.id, person_id:S.me.id, email: em, phone: phn } })
            .then(refresh).then(function(){ toast("Saved — reminders can reach you now."); })
            .catch(fail);
        };
      }
      var dots = el("div"); dots.style.cssText = "display:flex;gap:6px;margin:18px 0 4px";
      steps.forEach(function(_, j){
        var d = el("span","dot");
        d.style.background = j === i ? "var(--accent-ink)" : "var(--line-2)";
        dots.appendChild(d);
      });
      box.appendChild(dots);
      var acts = el("div","acts");
      if (i === 0){
        var skip = el("button","btn quiet","Skip");
        skip.onclick = finish;
        acts.appendChild(skip);
      } else {
        var back = el("button","btn","Back");
        back.onclick = function(){ i--; paint(); };
        acts.appendChild(back);
      }
      if (st.cta){
        var c = el("button","btn", st.cta.label);
        c.onclick = function(){ mark(); st.cta.go(); };
        acts.appendChild(c);
      }
      var next = el("button","btn dark", i === steps.length - 1 ? "Done" : "Next");
      next.onclick = function(){
        var after = function(){ if (i === steps.length - 1){ finish(); render(); } else { i++; paint(); } };
        if (saveContact) saveContact().then(after, after); else after();
      };
      acts.appendChild(next);
      box.appendChild(acts);
    });
  }
  function mark(){ try { localStorage.setItem(onboardKey(), "1"); } catch(_){} }
  function finish(){ mark(); closeModal(); }
  paint();
}
