<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anticipy HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Anticipy HQ.
   One file, no framework, no build step, no model call anywhere.
   Palette and type lifted from the Claude Design prototype: warm paper,
   one champagne mark, red only for late, green only for done.
   ========================================================================== */
:root{
  --paper:#F7F6F3; --card:#FFFFFF; --ink:#111111; --ink-2:#66625B; --ink-3:#6F6A62;
  --line:#E7E4DE; --line-2:#D8D4CC;
  --accent:#C8A97E; --accent-ink:#8A6B44; --accent-wash:rgba(200,169,126,.18);
  /* Measured, not guessed. --accent-ink is 4.21:1 behind 9.5px avatar
     initials and 4.13:1 behind the 11px "In progress" chip — both under
     AA for text that small. This darker sibling is 6.09:1 and 5.97:1 and
     is used wherever the champagne carries very small type. */
  --accent-ink-2:#6E5334;
  --danger:#A33A3A; --danger-wash:rgba(163,58,58,.08);
  --ok:#2E6B4F;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:10px; --r-lg:14px;
  --side:210px;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none}
a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.55}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- login ------------------------------------------------------- */
#login{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.lg{width:100%;max-width:340px;text-align:center;animation:fadeUp .3s}
.wordmark{display:flex;align-items:baseline;gap:7px;justify-content:center;margin-bottom:26px}
.wordmark .w1{font:400 27px/1 var(--serif)}
.wordmark .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wordmark .w2{font:800 12px/1 var(--sans);letter-spacing:.14em;color:var(--accent-ink)}
.lg p.sub{color:var(--ink-2);font-size:14px;margin:0 0 22px}
.lg input{width:100%;padding:13px 16px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);
  font-size:17px;text-align:center;letter-spacing:.1em}
.lg input:focus{border-color:var(--accent-ink);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
.lg button.go{width:100%;margin-top:10px;padding:13px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer}
.lg button.go:disabled{opacity:.5;cursor:default}
.lg button.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line-2)}
.lgor{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-3);font-size:12px}
.lgor::before,.lgor::after{content:"";flex:1;height:1px;background:var(--line)}
.lg .err{color:var(--danger);font-size:13px;min-height:19px;margin-top:12px}
.lg.bad{animation:shake .3s}
.lg .hint{margin-top:24px;font-size:12px;color:var(--ink-3);line-height:1.7}
#whoami{display:none;margin-top:20px}
#whoami .whorow{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#whoami button{padding:12px 16px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);cursor:pointer;
  display:flex;align-items:center;gap:10px;text-align:left}
#whoami button:hover{border-color:var(--accent-ink);background:#fff}

/* ---------- shell ------------------------------------------------------- */
#app{display:none;min-height:100%}
#app.on{display:flex}
aside{width:var(--side);flex:0 0 var(--side);border-right:1px solid var(--line);background:var(--paper);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .brand{padding:20px 18px 14px}
aside .brand button{border:0;background:transparent;padding:0;cursor:pointer}
aside .brand button:hover .w1{color:var(--accent-ink)}
aside nav{padding:0 10px;flex:1;overflow-y:auto}
aside .nv{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;margin-bottom:1px;
  border:0;background:transparent;border-radius:var(--r);cursor:pointer;font-size:14.5px;color:var(--ink-2);text-align:left}
aside .nv:hover{background:#EFEDE8;color:var(--ink)}
aside .nv.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(17,17,17,.05)}
aside .nv .ct{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
aside .nv.on .ct{color:var(--accent-ink)}
aside .nv .ct.alert{color:var(--danger)}
aside .foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
aside .foot .nm{flex:1;min-width:0}
aside .foot .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside .foot .nm span{display:block;font-size:11.5px;color:var(--ink-2)}
aside .foot button{border:0;background:transparent;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:6px}
aside .foot button:hover{background:#EFEDE8;color:var(--ink)}

main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-x:hidden}
header#top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--paper);z-index:20}
header#top .ttl{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header#top .srch{position:relative;width:min(300px,34vw)}
header#top .srch input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);font-size:13.5px}
header#top .srch input:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-wash)}
header#top .srch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;font-size:13px}
.btn{padding:8px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.btn.dark:hover{background:#000}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:#EFEDE8;color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--line-2)}
.btn.danger:hover{border-color:var(--danger)}
.bell{position:relative;padding:8px 10px}
.bell .n{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:999px;background:var(--accent);
  color:#3A2E1E;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
/* display:grid above beats the hidden attribute, which is how a badge
   reading "0" ended up sitting on the bell with nothing to report. */
.bell .n[hidden]{display:none}
#view{padding:26px 24px 90px;max-width:1120px;width:100%;animation:fadeIn .18s}
/* All Tasks is the one view with eight columns; it gets the extra room so
   the Updated column is not permanently pushed off the right edge. */
#view.wide{max-width:1280px}
.mobtoggle{display:none}

/* ---------- shared bits ------------------------------------------------- */
.greet{font:400 34px/1.15 var(--serif);margin:0 0 4px;text-wrap:balance}
.greet-sub{color:var(--ink-2);font-size:14px;margin:0 0 26px}
.seclabel{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 9px}
.seclabel .ct{color:var(--accent-ink);font-weight:700}
.seclabel.warn{color:var(--danger)}.seclabel.warn .ct{color:var(--danger)}
.sec{margin-bottom:30px}
.lead{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.empty{padding:22px;text-align:center;color:var(--ink-2);font-size:13.5px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg)}
.avi{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:#F0EDE7;border:1px solid var(--line);
  display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--accent-ink-2);letter-spacing:.02em}
.avi.lg{width:34px;height:34px;flex-basis:34px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;
  font-weight:600;white-space:nowrap;background:var(--paper);color:var(--ink-2)}
.chip.proj{background:var(--paper);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;display:inline-block}
.late{color:var(--danger)!important;font-weight:600}
.muted{color:var(--ink-2)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- task rows --------------------------------------------------- */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.row:last-child{border-bottom:0}
.row:hover{background:#FCFBF9}
.ck{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;
  cursor:pointer;display:grid;place-items:center;padding:0}
.ck:hover{border-color:var(--accent-ink)}
.grip{width:18px;flex:0 0 18px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  color:var(--line-2);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:0;background:transparent;padding:0}
.grip:hover{color:var(--ink-3)}
.row.dragging{position:relative;z-index:5;box-shadow:0 8px 24px rgba(17,17,17,.14);background:#fff;
  border-radius:var(--r);cursor:grabbing}
.row.dragging .grip{cursor:grabbing}
.ck.done{background:var(--ok);border-color:var(--ok)}
.ck.done::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row .tt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .tt .txt{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row.is-done .tt .txt,.row.is-cancel .tt .txt{color:var(--ink-2);text-decoration:line-through}
.row .meta{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-size:13px;color:var(--ink-2)}
.row .due{font-size:13px;min-width:74px;text-align:right}
.row .cm{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-2)}
.stagechip{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.stage-doing{background:var(--accent-wash);color:var(--accent-ink-2)}
.stage-blocked{background:var(--danger-wash);color:var(--danger)}
.stage-waiting{background:var(--paper);color:var(--ink-2)}
.priodot.urgent{background:var(--danger)}
.priodot.important{background:var(--accent-ink)}
.priodot.normal{background:var(--accent)}
.priodot.later{background:var(--line-2)}

/* ---------- filter chips ------------------------------------------------ */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line-2);border-radius:999px;
  background:var(--card);cursor:pointer;font-size:13px;color:var(--ink-2)}
.fchip:hover{border-color:var(--ink-3)}
.fchip.on{border-color:var(--accent-ink);color:var(--accent-ink);font-weight:600;background:#FDFBF7}
.fchip .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fchip.on .n{color:var(--accent-ink)}
.segbar{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--card)}
.segbar button{padding:6px 15px;border:0;background:transparent;cursor:pointer;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.segbar button:last-child{border-right:0}
.segbar button.on{background:var(--paper);color:var(--ink);font-weight:600}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}

/* ---------- team + project cards ---------------------------------------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--line-2);box-shadow:0 2px 8px rgba(17,17,17,.04)}
.card h3{margin:0 0 4px;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.card p.d{margin:0 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2)}
.stack{display:flex}
.stack .avi{margin-left:-5px;box-shadow:0 0 0 2px var(--card)}
.stack .avi:first-child{margin-left:0}
.teamcard .focus{font-size:13.5px;margin:10px 0 12px;color:var(--ink-2)}
.teamcard .focus b{color:var(--ink);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:3px 9px;border-radius:999px;background:var(--paper);font-size:11.5px;color:var(--ink-2);font-weight:500}
.pill.bad{background:var(--danger-wash);color:var(--danger);font-weight:600}

/* ---------- table ------------------------------------------------------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:840px}
table.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
table.t td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#FCFBF9}
table.t td.tsk{font-size:14px;width:34%;max-width:0}
table.t td.tsk span{display:inline-block;max-width:calc(100% - 30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.t td{white-space:nowrap}
table.t td .stagechip{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.t td .who{display:flex;align-items:center;gap:7px;white-space:nowrap}
.statuscell{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;display:inline-block}
.st-done{background:var(--ok);color:#fff}
.st-todo{background:var(--paper);color:var(--ink-2)}

/* ---------- calendar ---------------------------------------------------- */
.calwrap{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.calgrid{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.calhead h3{margin:0;font:400 19px/1 var(--serif)}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.caldow div{padding:7px 8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-2);text-align:right}
.calbody{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.out{background:#FAF9F6}
.cell .dn{font-size:12px;color:var(--ink-2);text-align:right;margin-bottom:4px;font-variant-numeric:tabular-nums}
.cell.today .dn{background:var(--danger);color:#fff;border-radius:999px;width:20px;height:20px;display:inline-grid;
  place-items:center;font-size:11px;margin-left:auto}
.cell.today .dn-wrap{display:flex;justify-content:flex-end}
.calchip{display:block;font-size:11px;padding:2px 5px;border-radius:5px;background:var(--paper);border:1px solid var(--line);
  margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.calchip.late{border-color:var(--danger);color:var(--danger)}
.calchip.done{color:var(--ink-2);text-decoration:line-through}
.calchip.ev{background:var(--accent-wash);border-color:transparent;color:var(--accent-ink);font-weight:600}
.unsched{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.unsched .u{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.unsched .u:last-child{border-bottom:0}

/* ---------- notifications + activity ------------------------------------ */
.nlist{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.nrow{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.nrow:last-child{border-bottom:0}
.nrow:hover{background:#FCFBF9}
.nrow.unread{background:#FDFBF7}
.nrow .bd{flex:1;min-width:0}
.nrow .bd b{font-weight:600;font-size:14px;display:block}
.nrow .bd span{font-size:13px;color:var(--ink-2);display:block;margin-top:1px}
.nrow .when{font-size:12px;color:var(--ink-3);white-space:nowrap;flex:0 0 auto}
.unreaddot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px;margin-top:7px}

/* ---------- settings ---------------------------------------------------- */
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);max-width:640px;overflow:hidden}
.frow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow label{flex:0 0 148px;font-size:13.5px;color:var(--ink-2)}
.frow .fv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow input[type=text],.frow input[type=email],.frow input[type=tel],.frow select{
  width:100%;max-width:290px;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);font-size:14px}
.frow input:focus,.frow select:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-wash)}
.tg{width:38px;height:22px;border-radius:999px;background:var(--line-2);border:0;cursor:pointer;position:relative;flex:0 0 38px}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--accent-ink)}
.tg.on::after{left:19px}
.okdot{color:var(--ok);font-weight:600;font-size:13.5px}
.offdot{color:var(--ink-2);font-size:13.5px}

/* ---------- task panel -------------------------------------------------- */
#scrim{position:fixed;inset:0;background:rgba(17,17,17,.28);z-index:40;display:none}
#scrim.on{display:block;animation:fadeIn .15s}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--card);border-left:1px solid var(--line);
  z-index:50;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(17,17,17,.08)}
#panel.on{display:flex;animation:slideIn .2s}
#panel .ph{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
#panel .pb{flex:1;overflow-y:auto;padding:16px 18px 30px}
#panel h2{margin:0;font-size:17px;font-weight:600;line-height:1.35;flex:1}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.prow label{flex:0 0 96px;color:var(--ink-2)}
.prow .pv{flex:1;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mini{padding:4px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--card);cursor:pointer;font-size:12.5px}
.mini:hover{border-color:var(--ink-3)}
.mini.on{border-color:var(--accent-ink);color:var(--accent-ink);font-weight:600;background:#FDFBF7}
.sublist{margin:8px 0 0}
.subitem{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px}
.subitem.done span{text-decoration:line-through;color:var(--ink-2)}
.cmt{padding:11px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt .ch{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cmt .ch b{font-size:13px;font-weight:600}
.cmt .ch span{font-size:11.5px;color:var(--ink-3)}
.cmt p{margin:0;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.cbox{display:flex;gap:8px;margin-top:12px}
.cbox textarea{flex:1;min-height:60px;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;resize:vertical;font-size:13.5px}
.cbox textarea:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-wash)}
.actlog{font-size:12.5px;color:var(--ink-2);padding:5px 0}

/* ---------- modal + toasts ---------------------------------------------- */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:60px 20px 20px;
  background:rgba(17,17,17,.3);overflow-y:auto}
#modal.on{display:flex;animation:fadeIn .15s}
.mbox{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:480px;padding:22px;animation:fadeUp .2s;
  box-shadow:0 18px 50px rgba(17,17,17,.16)}
.mbox h3{margin:0 0 16px;font:400 22px/1.2 var(--serif)}
.mbox .f{margin-bottom:13px}
.mbox .f > span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.mbox input[type=text],.mbox input[type=date],.mbox input[type=time],.mbox input[type=email],.mbox input[type=tel],.mbox select,.mbox textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);font-size:14.5px}
.mbox input:focus,.mbox select:focus,.mbox textarea:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-wash)}
.mbox .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.mbox .two{display:flex;gap:10px}
.mbox .two > *{flex:1}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 20px rgba(17,17,17,.2);animation:fadeUp .2s;max-width:90vw}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- responsive -------------------------------------------------- */
@media (max-width:860px){
  aside{position:fixed;left:0;top:0;bottom:0;z-index:45;transform:translateX(-100%);transition:transform .2s;background:var(--paper)}
  aside.open{transform:none;box-shadow:6px 0 24px rgba(17,17,17,.12)}
  main{width:100%}
  .mobtoggle{display:inline-flex}
  header#top{padding:12px 14px;gap:8px}
  header#top .srch{display:none}
  #view{padding:20px 14px 80px}
  .greet{font-size:27px}
  .calwrap{grid-template-columns:1fr}
  /* A phone row keeps the two things you actually scan for — what it is, and
     when it is due. The project chip and the priority dot are the first to go
     because both are visible again the moment you open the task. */
  .row{padding:11px 12px;gap:8px}
  .row .meta{gap:7px;min-width:0;flex-shrink:1}
  .row .meta .chip.proj,.row .meta .priodot,.row .meta .cm{display:none}
  .row .due{min-width:0;white-space:nowrap}
  /* A phone is too narrow for title + reason + date on one line, and squeezing
     all three produced "Countersign ND...", "O...", which names nothing. So the
     row becomes two lines: the task, then everything about it, indented under
     the checkbox. Nothing is dropped and nothing is truncated to noise. */
  .row{flex-wrap:wrap;row-gap:3px}
  /* The lead element is a checkbox on some rows and an avatar on others; both
     are pinned to 19px here so the second line indents to the same place
     either way. */
  .row > .ck,.row > .avi{width:19px;height:19px;flex-basis:19px;font-size:8.5px}
  .row .tt{flex:1 1 0;min-width:0;flex-wrap:wrap;overflow:hidden}
  .row .tt .txt{max-width:100%}
  .row .meta{flex-basis:100%;margin-left:27px;justify-content:flex-start;font-size:12.5px}
  .row .due{text-align:left}
  .row .stagechip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #addperson{display:none!important}
  .cards{grid-template-columns:1fr}
  .frow{flex-wrap:wrap}
  .frow label{flex-basis:100%}
  .prow{flex-wrap:wrap}
  .prow label{flex-basis:100%}
}
@media print{
  aside,header#top,#toasts,.filters,.toolbar,.btn{display:none!important}
  body{background:#fff}
  .rows,.card,.tblwrap{border-color:#ccc;box-shadow:none}
  #view{padding:0}
}

/* ---- the little AI on the side (not an AI-first interface) ---- */
#aiBtn{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
  background:var(--ink);color:var(--paper);border:none;font-size:17px;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:60;transition:transform .15s}
#aiBtn:hover{transform:scale(1.06)}
#aiPanel{position:fixed;right:0;top:0;bottom:0;width:340px;max-width:92vw;background:var(--card,#fff);
  border-left:1px solid var(--line-2);box-shadow:-8px 0 28px rgba(0,0,0,.08);z-index:61;
  display:none;flex-direction:column}
#aiPanel.open{display:flex}
#aiPanel .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
#aiPanel .hd b{font-size:14px;flex:1}
#aiPanel .hd button{background:none;border:none;font-size:16px;cursor:pointer;color:inherit;opacity:.6}
#aiLog{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
#aiLog .m{max-width:86%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
#aiLog .u{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
#aiLog .a{align-self:flex-start;background:var(--paper);border:1px solid var(--line-2);border-bottom-left-radius:4px}
#aiLog .act{align-self:flex-start;font-size:12.5px;padding:6px 10px;border-radius:8px;
  background:var(--paper);border:1px dashed var(--line-2);opacity:.9}
#aiLog .think{align-self:flex-start;font-size:12.5px;opacity:.55;padding:4px 2px}
#aiIn{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-2)}
#aiIn input{flex:1;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;font-size:13.5px}
#aiIn button{border:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:0 14px;cursor:pointer;font-size:13px}
#aiIn button:disabled{opacity:.4}
</style>

<body>

<div id="login">
  <div class="lg" id="lgbox">
    <div class="wordmark"><span class="w1">Anticipy</span><span class="dot"></span><span class="w2">HQ</span></div>

</div>

<div id="app">
  <aside id="side">

  <main>

      <button class="btn quiet mobtoggle" id="mobbtn" aria-label="Menu">&#9776;</button>

      <div class="srch"><span class="ic"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><input id="q" type="search" placeholder="Search tasks..." aria-label="Search tasks"></div>

      <button class="btn bell" id="bellbtn" aria-label="Notifications"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2a4 4 0 0 0-4 4c0 2.5-.7 3.6-1.2 4.2-.3.3-.1.8.3.8h9.8c.4 0 .6-.5.3-.8C12.7 9.6 12 8.5 12 6a4 4 0 0 0-4-4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 13a1.6 1.6 0 0 0 3 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="n" id="belln" hidden>0</span></button>

<div id="scrim"></div>
<div id="panel" role="dialog" aria-label="Task detail"></div>

<div id="toasts" aria-live="polite"></div>
<div class="sr" id="announce" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ===========================================================================
   Anticipy HQ — the whole client.
   Rules this file keeps, because breaking any one of them is a real bug:
     1. NOTHING person-typed is ever concatenated into HTML. Every title, note,
        name, comment and description is set with textContent through el().
        innerHTML appears in exactly two shapes and no third: cleared to "" ,
        and hard-coded icon literals that contain no interpolation at all.
        Grep for it — if a `+` or a `${` ever turns up next to innerHTML in
        this file, that is the bug. esc() is kept for the day a real HTML
        fragment is genuinely needed; nothing calls it today, deliberately.
     2. Nothing is drawn that cannot work. No "Connected" pill for a thing that
        is not connected, no control whose route does not exist.
     3. No model call anywhere. Not on load, not on typing, not ever.
   ========================================================================= */

/* ---------- state -------------------------------------------------------- */
var S = {
  key: null,          // team key, when signed in that way
  session: null,      // per-person session token
  me: null,           // person record
  viaSession: false,
  route: "today",
  param: null,
  q: "",
  data: { people:[], tracks:[], todos:[], events:[], notifs:[], comments:[], activity:[], expenses:[], passwords:[], notes:[], config:{}, channels:{} },
  // mtFilter defaults to "all": most tasks are born without a due date, and a
  // default "Today" view greeted their owner with "Nothing in this view."
  ui: { mtFilter:"all", mtView:"list", mtSort:"due", atFilter:"everyone", calOff:0, calDeadlines:true, exScope:"mine",
        /* mtSort is re-read from localStorage at boot so "My order" survives a reload */
        openTask:null, sideOpen:false, projTab:"open" },
  loading: false
};

/* ---------- the one escaping chokepoint ---------------------------------- */
function esc(v){
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; }
function jparse(s, fb){ try { var v = JSON.parse(s); return v === null ? fb : v; } catch(_){ return fb; } }

/* ---------- api ---------------------------------------------------------- */
function api(path, opts){
  opts = opts || {};
  var headers = {};
  if (S.session) headers["X-HQ-Session"] = S.session;
  else if (S.key) headers["X-Internal-Key"] = S.key;
  if (opts.body) headers["Content-Type"] = "application/json";
  return fetch(path, {
    method: opts.method || (opts.body ? "POST" : "GET"),
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if (r.status === 401 && S.session){ signOut(true); throw new Error("Signed out — please sign in again."); }
    return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : {}; } catch(_){ j = {}; }
      if (!r.ok) throw new Error(j.error || j.message || ("HTTP " + r.status));
      return j;
    });
  });
}

/* ---------- toasts ------------------------------------------------------- */
var toastEls = [];
function toast(msg, undoFn){
  var t = el("div","toast");
  t.appendChild(el("span", null, msg));
  if (undoFn){
    var b = el("button", null, "Undo");
    b.onclick = function(){ clearTimeout(t.__t); t.remove(); undoFn(); };
    t.appendChild(b);
  }
  $("toasts").appendChild(t);
  toastEls.push(t);
  while (toastEls.length > 3){ var o = toastEls.shift(); clearTimeout(o.__t); o.remove(); }
  t.__t = setTimeout(function(){ t.remove(); toastEls = toastEls.filter(function(x){ return x !== t; }); }, 5000);
  $("announce").textContent = msg;
}
function fail(e){ toast(e && e.message ? e.message : "That didn't save."); }

/* ---------- dates -------------------------------------------------------- */
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
function shift(n){ var d = new Date(); d.setDate(d.getDate()+n); return iso(d); }
function dayLabel(ds){
  if (!ds) return "No date";
  if (ds === today()) return "Today";
  if (ds === shift(1)) return "Tomorrow";
  if (ds === shift(-1)) return "Yesterday";
  var dt = new Date(ds + "T12:00"), diff = Math.round((dt - new Date(today()+"T12:00")) / 86400000);
  if (diff > 1 && diff < 7) return dt.toLocaleDateString("en-US",{weekday:"short"});
  return dt.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function fmtTime(t){
  if (!t) return "";
  var h = +t.slice(0,2), m = t.slice(3,5), h12 = ((h+11)%12)+1;
  return h12 + (m !== "00" ? ":"+m : "") + (h < 12 ? " AM" : " PM");
}
function ago(str){
  if (!str) return "";
  var t = Date.parse(String(str).replace(" ","T").replace(/(\.\d+)?Z?$/, "Z"));
  if (isNaN(t)) return "";
  var m = Math.max(1, Math.round((Date.now()-t)/60000));
  if (m < 60) return m + "m ago";
  var h = Math.round(m/60); if (h < 24) return h + "h ago";
  var d = Math.round(h/24); return d === 1 ? "yesterday" : d + "d ago";
}

/* ---------- task helpers ------------------------------------------------- */
function isOpen(t){ return t.status !== "done"; }
function isLate(t){ return isOpen(t) && t.due && t.due < today(); }
function assigneesOf(t){ return jparse(t.assignees, []) || []; }
function watchersOf(t){ return jparse(t.watchers, []) || []; }
function subtasksOf(t){ return jparse(t.subtasks, []) || []; }
function person(id){ for (var i=0;i<S.data.people.length;i++) if (S.data.people[i].id === id) return S.data.people[i]; return null; }
function pname(id){ var p = person(id); return p ? p.name : "Unassigned"; }
function initials(id){ var p = person(id); return p ? p.name.slice(0,2).toUpperCase() : "--"; }
function track(id){ for (var i=0;i<S.data.tracks.length;i++) if (S.data.tracks[i].id === id) return S.data.tracks[i]; return null; }
function tname(id){ var t = track(id); return t ? t.name : ""; }
function findTodo(id){ for (var i=0;i<S.data.todos.length;i++) if (S.data.todos[i].id === id) return S.data.todos[i]; return null; }
function activePeople(){ return S.data.people.filter(function(p){ return p.active; }); }
function liveTracks(){ return S.data.tracks.filter(function(t){ return t.active && !t.archived; }); }
function mine(t){ return S.me && assigneesOf(t).indexOf(S.me.id) >= 0; }
function isAdmin(){ return !!(S.me && S.me.is_admin); }

var STAGE_LABEL = { todo:"To do", doing:"In progress", waiting:"Waiting", blocked:"Blocked" };
var PRIO_LABEL  = { urgent:"Urgent", important:"Important", normal:"Normal", later:"Later" };

function dueView(t){
  if (!t.due) return { label:"No date", cls:"muted" };
  var lbl = dayLabel(t.due) + (t.due_time && t.due === today() ? " " + fmtTime(t.due_time) : "");
  if (isLate(t)) return { label: lbl + " · overdue", cls:"late" };
  if (t.due === today()) return { label: lbl, cls:"" };
  return { label: lbl, cls:"muted" };
}
function stageChip(t){
  if (t.status === "done") return null;
  if (t.stage === "blocked") return { txt: t.hold_reason ? "Blocked — " + t.hold_reason : "Blocked", cls:"stage-blocked" };
  if (t.stage === "waiting") return { txt: t.hold_reason || "Waiting", cls:"stage-waiting" };
  if (t.stage === "doing")   return { txt: "In progress", cls:"stage-doing" };
  return null;
}

/* ---------- one task row ------------------------------------------------- */
function taskRow(t, opts){
  opts = opts || {};
  var r = el("div", "row" + (t.status === "done" ? " is-done" : ""));
  r.onclick = function(){ openTask(t.id); };

  if (opts.avatar){
    var a = el("div","avi", initials(assigneesOf(t)[0]));
    a.title = pname(assigneesOf(t)[0]);
    r.appendChild(a);
  } else {
    var ck = el("button","ck" + (t.status === "done" ? " done" : ""));
    ck.setAttribute("aria-label", t.status === "done" ? "Reopen task" : "Mark done");
    ck.onclick = function(e){ e.stopPropagation(); toggleDone(t.id); };
    r.appendChild(ck);
  }

  var tt = el("div","tt");
  tt.appendChild(el("span","txt", t.title));
  var sc = stageChip(t);
  if (sc) tt.appendChild(el("span","stagechip " + sc.cls, sc.txt));
  r.appendChild(tt);

  var meta = el("div","meta");
  if (opts.project !== false && t.track) meta.appendChild(el("span","chip proj", tname(t.track)));
  if (t.priority && t.priority !== "normal" && t.status !== "done"){
    var d = el("span","dot priodot " + t.priority); d.title = PRIO_LABEL[t.priority]; meta.appendChild(d);
  }
  if (t.cmt_count){
    var cm = el("span","cm");
    // Static icon markup, no interpolation. See rule 1 at the top of the file.
    cm.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
      + '<path d="M14 9.5a1.5 1.5 0 0 1-1.5 1.5H5l-3 2.5V4a1.5 1.5 0 0 1 1.5-1.5h9A1.5 1.5 0 0 1 14 4v5.5z" '
      + 'stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
    cm.appendChild(document.createTextNode(String(t.cmt_count)));
    meta.appendChild(cm);
  }
  var dv = dueView(t);
  meta.appendChild(el("span","due " + dv.cls, dv.label));
  r.appendChild(meta);
  return r;
}
function rowsBlock(list, opts, emptyText){
  if (!list.length){ return el("div","empty", emptyText || "Nothing here."); }
  var w = el("div","rows");
  list.forEach(function(t){ w.appendChild(taskRow(t, opts)); });
  return w;
}
function section(label, count, node, tone){
  var s = el("div","sec");
  var h = el("div","seclabel" + (tone === "warn" ? " warn" : ""));
  h.appendChild(el("span", null, label));
  if (count) h.appendChild(el("span","ct", String(count)));
  s.appendChild(h); s.appendChild(node);
  return s;
}

/* ---------- sort/filter -------------------------------------------------- */
function byDue(a,b){
  var ad = a.due || "9999-99-99", bd = b.due || "9999-99-99";
  if (ad !== bd) return ad < bd ? -1 : 1;
  var at = a.due_time || "99:99", bt = b.due_time || "99:99";
  return at < bt ? -1 : at > bt ? 1 : 0;
}
function searchHit(t){
  if (!S.q) return true;
  var q = S.q.toLowerCase();
  return (t.title||"").toLowerCase().indexOf(q) >= 0
      || (t.notes||"").toLowerCase().indexOf(q) >= 0
      || tname(t.track).toLowerCase().indexOf(q) >= 0;
}
function visibleTodos(){ return S.data.todos.filter(searchHit); }

/* ---------- Clerk -------------------------------------------------------- */
// The publishable key is public by design — it is the frontend domain, encoded.
// The SECRET key lives on Railway and never appears in this file.
var CLERK_PK = "pk_test_aW4tcGFudGhlci0zMzg0LmNsZXJrLmFjY291bnRzLmRldiQ";
var clerkLoading = null;
function loadClerk(){
  if (window.Clerk && window.Clerk.loaded) return Promise.resolve(window.Clerk);
  if (clerkLoading) return clerkLoading;
  clerkLoading = new Promise(function(resolve, reject){
    var sc = document.createElement("script");
    // Served from this instance's own frontend API host, per Clerk's docs.
    sc.src = "https://in-panther-3384.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
    sc.setAttribute("data-clerk-publishable-key", CLERK_PK);
    sc.async = true; sc.crossOrigin = "anonymous";
    sc.onload = function(){

// One job: a signed-in Clerk user becomes an ordinary HQ session. After this
// returns, the rest of the app cannot tell Clerk was ever involved.
function clerkExchange(clerk){
  // The "hq" template: HS256, 60-second life, email in the claims. It is the
  // only token shape the backend accepts.
  return clerk.session.getToken({ template: "hq" }).then(function(jwt){
    return api("/internal/clerk/exchange", { body: { token: jwt } });
  }).then(function(r){
    if (!r.ok || !r.token) throw new Error(r.error || "sign-in failed");
    S.session = r.token; S.key = null;
    stSet("hq_session", r.token); stDrop("hq_key");
    return whoAmI().then(start);
  });
}
function clerkSignIn(){
  // Pressing the button is an explicit "I want in" — it cancels any
  // standing sign-out.

  btn.disabled = true; $("lgerr").textContent = "";

    if (clerk.user) return clerkExchange(clerk);       // already signed in to Clerk
    return new Promise(function(){                      // modal; resolution happens via the listener
      // OAuth has to leave the page and come back; without these it comes
      // back to the homepage and the sign-in evaporates on a page that has
      // no Clerk on it.
      var here = location.origin + "/internal";
      clerk.openSignIn({ forceRedirectUrl: here, fallbackRedirectUrl: here });
      clerk.addListener(function(state){
        if (state.user && !clerkSignIn._done){
          clerkSignIn._done = true;
          clerk.closeSignIn();
          clerkExchange(clerk).catch(function(err){
            clerkSignIn._done = false;
            loginError(err.message || "That sign-in didn't work.");
          });
        }
      });
    });
  }).catch(function(err){
    loginError(err.message || "Couldn't reach the sign-in service.");
  }).finally(function(){ btn.disabled = false; btn.textContent = oldLabel; });
}

/* ---------- boot / login ------------------------------------------------- */
/* Storage: localStorage, so a new tab and a restarted browser stay signed in —
   the server's 30-day session expiry is the real boundary, and per-tab storage
   just made people "sign in" over and over into a button that then did
   something silent and confusing. sessionStorage is still read once, so the
   session that existed before this change migrates instead of dying. */
function stGet(k){
  var v = null;
  try { v = localStorage.getItem(k); } catch(_){}
  if (!v){ try { v = sessionStorage.getItem(k); } catch(_){} }
  return v;
}
function stSet(k, v){
  try { localStorage.setItem(k, v); } catch(_){}
  try { sessionStorage.removeItem(k); } catch(_){}
}
function stDrop(k){
  try { localStorage.removeItem(k); } catch(_){}
  try { sessionStorage.removeItem(k); } catch(_){}
}
function boot(){
  aiBoot();
  try { var ms = localStorage.getItem("hq_mtsort"); if (ms) S.ui.mtSort = ms; } catch(_){}
  // Returning leg of an OAuth round trip (Clerk dev instances append
  // __clerk_db_jwt). Finish the sign-in automatically instead of presenting
  // the login screen to somebody who just signed in.
  if (location.href.indexOf("__clerk_db_jwt") >= 0){
    showLogin();
    clerkSignIn();
    try { history.replaceState(null, "", location.pathname + location.hash.split("?")[0]); } catch(_){}
    return;
  }
  var tok = stGet("hq_session"), key = stGet("hq_key");
  if (tok){ S.session = tok; return whoAmI().then(start).catch(function(){ S.session = null; showLogin(); }); }
  if (key){
    S.key = key;
    var who = stGet("hq_me");
    if (who) return whoAmI(who).then(start).catch(function(){ S.key = null; showLogin(); });
  }
  showLogin();
  // No HQ session, but Clerk may still hold a live sign-in (a reload race, a
  // cleared cache, a brand-new tab pre-migration). Walking straight in is
  // right ONLY when the person didn't just ask to leave: an explicit
  // sign-out sets hq_signed_out, and that flag keeps this path closed until
  // they deliberately press the button again.
  var away = null; try { away = localStorage.getItem("hq_signed_out"); } catch(_){}
  if (!away){
    loadClerk().then(function(clerk){
      if (clerk.user && !S.me) return clerkExchange(clerk);
    }).catch(function(){});
  }
}
function whoAmI(actorId){
  var url = "/internal/me" + (actorId ? "?actor_id=" + encodeURIComponent(actorId) : "");
  return api(url).then(function(r){
    S.me = r.person; S.viaSession = !!r.via_session;
    S.data.config = { team_name:r.team_name, perm_assign:r.perm_assign, perm_delete:r.perm_delete };
    return r;
  });
}
function showLogin(){
  $("login").style.display = "flex"; $("app").classList.remove("on");
  // Start fetching clerk-js NOW, not on the click. It is a third of a
  // megabyte, and "I pressed the button and nothing happened" was the
  // observable result of loading it lazily.
  loadClerk().catch(function(){});
}
function loginError(msg){
  $("lgerr").textContent = msg;
  $("lgbox").classList.remove("bad"); void $("lgbox").offsetWidth; $("lgbox").classList.add("bad");
  $("lggo").disabled = false;
}
function submitLogin(e){
  e.preventDefault();
  var code = $("lgcode").value.trim();
  if (!code) return;
  $("lggo").disabled = true; $("lgerr").textContent = "";
  var cleaned = code.toUpperCase().replace(/[^A-Z0-9]/g,"");

  // A personal code is eight characters. Anything else is tried as the team
  // key first, so "123" keeps working exactly as it did.
  var tryPersonal = cleaned.length === 8;
  var first = tryPersonal ? sessionLogin(code) : keyLogin(code);
  var second = tryPersonal ? function(){ return keyLogin(code); } : function(){ return cleaned.length === 8 ? sessionLogin(code) : Promise.reject(new Error("no")); };

  first.catch(second).catch(function(){
    loginError("That code didn't match. Check it and try again.");
  });
}
function sessionLogin(code){
  return api("/internal/session", { body:{ code: code } }).then(function(r){
    if (!r.ok || !r.token) throw new Error(r.message || "no");
    S.session = r.token; S.key = null;
    stSet("hq_session", r.token); stDrop("hq_key");
    try { localStorage.removeItem("hq_signed_out"); } catch(_){}
    return whoAmI().then(start);
  });
}
function keyLogin(key){
  return api("/internal/login", { body:{ key: key } }).then(function(r){
    if (!r.ok) throw new Error("no");
    S.key = key;
    stSet("hq_key", key);
    try { localStorage.removeItem("hq_signed_out"); } catch(_){}
    return pickWho();
  });
}
function pickWho(){
  // The team key says you may be here. It does not say who you are.
  return api("/internal/state").then(function(st){
    S.data.people = st.people || [];
    var row = $("whorow"); row.innerHTML = "";
    activePeople().forEach(function(p){
      var b = el("button");

    $("lghint").style.display = "none";
    // "Enter your code." is answered by now; leaving it above the name list
    // reads as a second thing still being asked for.
    var sub = $("lgbox").querySelector("p.sub");
    if (sub) sub.style.display = "none";
    $("whoami").style.display = "block";
  });
}
function signOut(quiet){
  // Sign out was quietly a lie: it cleared HQ's session, but clerk-js is not
  // loaded on the app screen, so Clerk's own session survived — and the next
  // press of the button resurrected the same person with no Google screen
  // and no choice. Found live by the founder. Now: clear local state, LOAD
  // Clerk if needed and end its session too, and leave a hq_signed_out flag
  // so the auto sign-in path stays closed until somebody explicitly asks in.
  stDrop("hq_session"); stDrop("hq_key"); stDrop("hq_me");
  try { localStorage.setItem("hq_signed_out", "1"); } catch(_){}
  var reload = function(){ location.reload(); };
  var killClerk = function(){
    // 4s cap: sign-out must never hang on a slow script fetch. If Clerk can't
    // be reached, its session may survive — but the hq_signed_out flag keeps
    // the door shut regardless, so the worst case is one extra click later.
    var timed = new Promise(function(res){ setTimeout(res, 4000); });
    var kill = loadClerk().then(function(clerk){
      return clerk.user ? clerk.signOut() : null;
    });
    return Promise.race([kill, timed]);
  };
  var bye = function(){ killClerk().then(reload, reload); };
  if (S.session && !quiet) return api("/internal/session/end", { body:{} }).then(bye, bye);
  bye();
}
function start(){
  $("login").style.display = "none";
  $("app").classList.add("on");

    if (location.hash) applyHash();
    render();
    maybeOnboard();
    setInterval(function(){ if (!document.hidden && !$("modal").classList.contains("on")) refresh().then(render).catch(function(){}); }, 30000);
  }).catch(fail);
}
function refresh(){
  var url = "/internal/state";
  // Sessions carry identity on their own; the key does not. Without this,
  // key-mode sign-ins had a bell that could never ring.
  if (!S.session && S.me) url += "?actor_id=" + encodeURIComponent(S.me.id);
  return api(url).then(function(st){
    ["people","tracks","todos","events","notifs","comments","activity","expenses","passwords","notes"].forEach(function(k){ S.data[k] = st[k] || []; });
    S.data.config = st.config || S.data.config; S.data.channels = st.channels || {};
    if (st.via_session) S.viaSession = true;
    if (S.me){ var fresh = person(S.me.id); if (fresh) S.me = Object.assign({}, S.me, fresh); }
  });
}

<script>

/* ========================= TODAY ========================================= */

function viewToday(v){

  v.appendChild(h);

  // The one nudge that pays for itself: reminders and Clerk sign-in both key

/* ========================= ALL TASKS ===================================== */

/* ========================= CALENDAR ====================================== */
function viewCalendar(v){
  var tb = el("div","toolbar");
  var prev = el("button","btn","‹"), next = el("button","btn","›"), tod = el("button","btn","Today");
  prev.onclick = function(){ S.ui.calOff--; render(); };
  next.onclick = function(){ S.ui.calOff++; render(); };
  tod.onclick = function(){ S.ui.calOff = 0; render(); };
  tb.appendChild(prev); tb.appendChild(next); tb.appendChild(tod);
  tb.appendChild(el("div","sp"));
  var ne = el("button","btn","+ New Event"); ne.onclick = newEventModal; tb.appendChild(ne);
  v.appendChild(tb);

  var wrap = el("div","calwrap");
  var base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + S.ui.calOff);
  var y = base.getFullYear(), m = base.getMonth();
  var grid = el("div","calgrid");
  var gh = el("div","calhead");
  gh.appendChild(el("h3", null, base.toLocaleDateString("en-US",{month:"long",year:"numeric"})));
  grid.appendChild(gh);
  var dow = el("div","caldow");
  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(function(d){ dow.appendChild(el("div",null,d)); });
  grid.appendChild(dow);
  var body = el("div","calbody");
  var first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  var byDate = {};
  // Events go in first on purpose. A day cell shows five things, and a
  // meeting you have to be at matters more than the sixth task due that day.
  S.data.events.forEach(function(e){ if (!e.date) return; (byDate[e.date] = byDate[e.date] || []).push({ kind:"event", e:e }); });
  S.data.todos.forEach(function(t){ if (!t.due) return; (byDate[t.due] = byDate[t.due] || []).push({ kind:"task", t:t }); });
  for (var i=0;i<42;i++){
    var d = new Date(start); d.setDate(start.getDate()+i);
    var ds = iso(d);
    var cell = el("div","cell" + (d.getMonth() !== m ? " out" : "") + (ds === today() ? " today" : ""));
    var dnw = el("div","dn-wrap"); dnw.appendChild(el("div","dn", String(d.getDate())));
    cell.appendChild(dnw);
    (byDate[ds] || []).slice(0,5).forEach(function(x){
      if (x.kind === "event"){
        var c = el("div","calchip ev", x.e.title);
        cell.appendChild(c);
      } else {
        var t = x.t;
        var c2 = el("div","calchip" + (isLate(t) ? " late" : "") + (t.status === "done" ? " done" : ""),
                    (t.due_time ? fmtTime(t.due_time) + " " : "") + t.title);
        c2.onclick = function(ev){ ev.stopPropagation(); openTask(t.id); };
        cell.appendChild(c2);
      }
    });
    body.appendChild(cell);
  }
  grid.appendChild(body);
  wrap.appendChild(grid);

  var side = el("div","unsched");
  side.appendChild(el("div","seclabel","Unscheduled"));
  var uns = S.data.todos.filter(function(t){ return isOpen(t) && !t.due; });
  if (!uns.length) side.appendChild(el("p","muted","Everything open has a date."));
  uns.forEach(function(t){
    var u = el("div","u", t.title);
    u.onclick = function(){ openTask(t.id); };
    side.appendChild(u);
  });
  var integ = el("button","btn","Integrate with your calendars");
  integ.style.cssText = "width:100%;margin-top:14px";
  integ.onclick = calendarIntegrationModal;
  side.appendChild(integ);
  wrap.appendChild(side);
  v.appendChild(wrap);
}

function openTask(id){ S.ui.openTask = id; drawPanel(); }
function closeTask(){ S.ui.openTask = null; $("panel").classList.remove("on"); $("scrim").classList.remove("on"); }
function drawPanel(){
  var t = findTodo(S.ui.openTask);
  var p = $("panel");
  if (!t){ closeTask(); return; }
  p.innerHTML = "";
  $("scrim").classList.add("on"); p.classList.add("on");

  var ph = el("div","ph");
  var ck = el("button","ck" + (t.status === "done" ? " done" : ""));
  ck.setAttribute("aria-label","Toggle done");
  ck.onclick = function(){ toggleDone(t.id).then(drawPanel); };
  ph.appendChild(ck);
  var h2 = el("h2", null, t.title);
  h2.contentEditable = "true"; h2.spellcheck = false;
  h2.onblur = function(){
    var nv = h2.textContent.trim();
    if (nv && nv !== t.title) patchTodo(t.id, { title: nv }).then(function(){ toast("Renamed."); });
  };
  ph.appendChild(h2);
  var x = el("button","btn quiet","✕"); x.onclick = closeTask; ph.appendChild(x);
  p.appendChild(ph);

  var b = el("div","pb");
  function prow(label, node){
    var r = el("div","prow"); r.appendChild(el("label", null, label));
    var vv = el("div","pv"); if (node) vv.appendChild(node); r.appendChild(vv); b.appendChild(r); return vv;
  }
  // assignee
  var as = prow("Assignee");
  activePeople().forEach(function(pp){
    var on = assigneesOf(t).indexOf(pp.id) >= 0;
    var btn = el("button","mini" + (on ? " on" : ""), pp.name);
    btn.onclick = function(){
      var cur = assigneesOf(t);
      var next = on ? cur.filter(function(i){ return i !== pp.id; }) : cur.concat([pp.id]);
      patchTodo(t.id, { assignees: next }).then(drawPanel);
    };
    as.appendChild(btn);
  });
  // stage
  var stg = prow("Status");
  ["todo","doing","waiting","blocked"].forEach(function(k){
    var btn = el("button","mini" + ((t.stage||"todo") === k ? " on" : ""), STAGE_LABEL[k]);
    btn.onclick = function(){
      var patch = { stage:k };
      if (k === "waiting" || k === "blocked"){
        var why = prompt(k === "blocked" ? "Blocked on what?" : "Waiting on what?", t.hold_reason || "");
        if (why === null) return;
        patch.hold_reason = why.trim();
      } else patch.hold_reason = "";
      patchTodo(t.id, patch).then(drawPanel);
    };
    stg.appendChild(btn);
  });
  // priority
  var pr = prow("Priority");
  ["urgent","important","normal","later"].forEach(function(k){
    var btn = el("button","mini" + ((t.priority||"normal") === k ? " on" : ""), PRIO_LABEL[k]);
    btn.onclick = function(){ patchTodo(t.id, { priority:k }).then(drawPanel); };
    pr.appendChild(btn);
  });
  // due
  var dd = prow("Due");
  var di = document.createElement("input"); di.type = "date"; di.value = t.due || ""; di.className = "mini";
  di.onchange = function(){ patchTodo(t.id, { due: di.value }).then(drawPanel); };
  dd.appendChild(di);
  var ti = document.createElement("input"); ti.type = "time"; ti.value = t.due_time || ""; ti.className = "mini";
  ti.onchange = function(){ patchTodo(t.id, { due_time: ti.value }).then(drawPanel); };
  dd.appendChild(ti);
  // project
  var pj = prow("Project");
  var ps = document.createElement("select"); ps.className = "mini";
  liveTracks().forEach(function(tr){
    var o = el("option", null, tr.name); o.value = tr.id; if (tr.id === t.track) o.selected = true; ps.appendChild(o);
  });
  ps.onchange = function(){ patchTodo(t.id, { track: ps.value }).then(drawPanel); };
  pj.appendChild(ps);
  // created
  prow("Created", el("span","muted", pname(t.created_by) + " · " + ago(t.created)));

  // notes — READ view first, edit on demand. The old three-line scroll box
  // made every long note unreadable; a task's note is its document, and a
  // document you cannot see is bad communication (Omar, 2026-08-24).
  b.appendChild(el("div","seclabel","Notes"));
  var noteWrap = el("div");
  function drawNotes(editing){
    noteWrap.innerHTML = "";
    var val = t.notes || "";
    if (val && !editing){
      var rd = el("div");
      rd.style.cssText = "white-space:pre-wrap;font-size:13.5px;line-height:1.7;" +
        "padding:12px 14px;border:1px solid var(--line-2);border-radius:8px";
      rd.textContent = val;
      noteWrap.appendChild(rd);
      var eb = el("button","btn quiet","Edit notes");
      eb.style.marginTop = "6px";
      eb.onclick = function(){ drawNotes(true); };
      noteWrap.appendChild(eb);
      return;
    }
    var na = document.createElement("textarea");
    na.value = val; na.placeholder = "Anything worth remembering about this.";
    na.style.cssText = "width:100%;min-height:70px;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;font-size:13.5px;line-height:1.6;resize:vertical";
    var grow = function(){ na.style.height = "auto"; na.style.height = Math.min(na.scrollHeight + 4, 640) + "px"; };
    na.oninput = grow;
    na.onblur = function(){
      if (na.value !== (t.notes||"")) {
        t.notes = na.value;
        patchTodo(t.id, { notes: na.value }).then(function(){ toast("Saved."); });
      }
      drawNotes(false);
    };
    noteWrap.appendChild(na);
    setTimeout(function(){ grow(); if (editing) na.focus(); }, 0);
  }
  drawNotes(false);
  b.appendChild(noteWrap);

  // subtasks
  b.appendChild(el("div","seclabel","Steps"));
  var subs = subtasksOf(t);
  var sl = el("div","sublist");
  subs.forEach(function(s, i){
    var it = el("div","subitem" + (s.done ? " done" : ""));
    var c = el("button","ck" + (s.done ? " done" : ""));
    c.onclick = function(){
      var next = subs.slice(); next[i] = { t:s.t, done: !s.done };
      patchTodo(t.id, { subtasks: next }).then(drawPanel);
    };
    it.appendChild(c);
    it.appendChild(el("span", null, s.t));
    var d = el("button","btn quiet","✕"); d.style.marginLeft = "auto";
    d.onclick = function(){
      var next = subs.filter(function(_, j){ return j !== i; });
      patchTodo(t.id, { subtasks: next }).then(drawPanel);
    };
    it.appendChild(d);
    sl.appendChild(it);
  });
  var si = document.createElement("input"); si.type = "text"; si.placeholder = "Add a step…";
  si.style.cssText = "width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;font-size:13.5px;margin-top:6px";
  si.onkeydown = function(e){
    if (e.key !== "Enter" || !si.value.trim()) return;
    var next = subs.concat([{ t: si.value.trim(), done:false }]);
    si.value = "";
    patchTodo(t.id, { subtasks: next }).then(drawPanel);
  };
  sl.appendChild(si);
  b.appendChild(sl);

  // comments
  b.appendChild(el("div","seclabel","Comments"));
  var mine2 = S.data.comments.filter(function(c){ return c.todo === t.id; });
  if (!mine2.length) b.appendChild(el("p","muted","No comments yet."));
  mine2.forEach(function(c){
    var box = el("div","cmt");
    var hd = el("div","ch");
    hd.appendChild(el("span","avi", (c.author_name || "?").slice(0,2).toUpperCase()));
    hd.appendChild(el("b", null, c.author_name || "Someone"));
    hd.appendChild(el("span", null, ago(c.created)));
    box.appendChild(hd);
    box.appendChild(el("p", null, c.text || "(deleted)"));
    b.appendChild(box);
  });
  var cb = el("div","cbox");
  var ta = document.createElement("textarea"); ta.placeholder = "Write a comment…";
  var send = el("button","btn dark","Post");
  send.onclick = function(){
    if (!ta.value.trim()) return;
    api("/internal/comments", { body:{ actor_id:S.me.id, todo_id:t.id, text: ta.value.trim() } })
      .then(function(){ ta.value = ""; return refresh(); }).then(function(){ drawPanel(); render(); }).catch(fail);
  };
  cb.appendChild(ta); cb.appendChild(send);
  b.appendChild(cb);

  // Delete appears only for the people the server will actually allow —
  // admins always; the creator when the team rule includes them. A button
  // that exists only to be refused teaches people the buttons lie.
  var rule = S.data.config.perm_delete || "creator";
  var mayDelete = isAdmin() || (rule === "creator" && S.me && t.created_by === S.me.id);
  if (!mayDelete){ p.appendChild(b); return; }
  var dl = el("button","btn danger","Delete task"); dl.style.marginTop = "22px";
  dl.onclick = function(){
    if (!confirm("Delete “" + t.title + "”? This cannot be undone.")) return;
    api("/internal/todos/delete", { body:{ actor_id:S.me.id, todo_id:t.id } })
      .then(function(){ closeTask(); toast("Deleted."); return refresh(); }).then(render).catch(fail);
  };
  b.appendChild(dl);
  p.appendChild(b);
}

/* ========================= MUTATIONS ===================================== */
function patchTodo(id, patch){
  var body = { actor_id: S.me.id, todo_id: id };
  for (var k in patch) body[k] = patch[k];
  return api("/internal/todos", { method:"PATCH", body: body })
    .then(refresh).then(function(){ render(); }).catch(function(e){ fail(e); throw e; });
}
function toggleDone(id){
  var t = findTodo(id); if (!t) return Promise.resolve();
  var goingDone = t.status !== "done";
  return patchTodo(id, { status: goingDone ? "done" : "open" }).then(function(){
    toast(goingDone ? "Completed — " + t.title : "Reopened — " + t.title, function(){ toggleDone(id); });
  });
}

/* ========================= THE LITTLE AI ================================= */
/* A chat button on the side that can control the to-dos. Deliberately not
   an AI-first interface: one small circle, one slim panel, the rest of HQ
   untouched. Lives outside render() so route changes never eat the chat. */
var AI = { msgs: [], busy: false };
function aiBoot(){
  if (document.getElementById("aiBtn")) return;
  var b = document.createElement("button");
  b.id = "aiBtn"; b.textContent = "\u2726"; b.title = "Assistant";
  b.onclick = aiToggle;
  document.body.appendChild(b);
  var p = document.createElement("div"); p.id = "aiPanel";
  p.innerHTML = '<div class="hd"><b>Assistant</b><button id="aiX" title="Close">\u2715</button></div>'
    + '<div id="aiLog"></div>'
    + '<div id="aiIn"><input id="aiT" type="text" placeholder="Add, complete, remove, ask\u2026" autocomplete="off">'
    + '<button id="aiGo">Send</button></div>';
  document.body.appendChild(p);
  document.getElementById("aiX").onclick = aiToggle;
  document.getElementById("aiGo").onclick = aiSend;
  document.getElementById("aiT").onkeydown = function(ev){
    if (ev.key === "Enter") aiSend();
    if (ev.key === "Escape") aiToggle();
  };
}
function aiToggle(){
  var p = document.getElementById("aiPanel");
  p.classList.toggle("open");
  if (p.classList.contains("open")){
    if (!AI.msgs.length) aiBubble("a", "Hi \u2014 I can add, complete, remove and flag to-dos, set reminders, or answer questions about the board. What do you need?");
    document.getElementById("aiT").focus();
  }
}
function aiBubble(kind, text){
  var log = document.getElementById("aiLog");
  var d = document.createElement("div");
  d.className = (kind === "act" || kind === "think") ? kind : ("m " + kind);
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function aiSend(){
  if (AI.busy) return;
  var t = document.getElementById("aiT");
  var text = t.value.trim();
  if (!text) return;
  if (!S.me){ aiBubble("a", "Pick yourself in the top bar first \u2014 I act as you."); return; }
  t.value = ""; aiBubble("u", text);
  AI.msgs.push({ role: "user", content: text });
  // The server caps the window at 12 turns; slide, never fail.
  while (AI.msgs.length > 11) AI.msgs.shift();
  AI.busy = true; document.getElementById("aiGo").disabled = true;
  var thinking = aiBubble("think", "thinking\u2026");
  api("/internal/assistant", { body: { actor_id: S.me.id, messages: AI.msgs } })
    .then(function(res){
      thinking.remove();
      if (res.done && res.done.summary){
        aiBubble("act", "\u2713 " + res.done.summary);
        AI.msgs.push({ role: "assistant", content: "[did] " + res.done.summary });
        return refresh().then(render);
      }
      var say = res.say || res.question || "Sorry \u2014 say that again?";
      aiBubble("a", say);
      AI.msgs.push({ role: "assistant", content: say });
    })
    .catch(function(err){
      thinking.remove();
      aiBubble("a", (err && err.message) ? err.message : "Something broke \u2014 try again.");
    })
    .then(function(){ AI.busy = false; document.getElementById("aiGo").disabled = false; });
}

/* ========================= EXPENSES ====================================== */
/* One table, two lenses. "Mine" is the personal tracker; "Company" is the
   same rows with everyone's names on — the log the company can know. */
function fmtMoney(n, cur){
  return "$" + (Number(n) || 0).toFixed(2) + " " + (cur || "CAD");
}
function viewExpenses(v){
  var tb = el("div","toolbar");
  var seg = el("div","segbar");
  [["mine","Mine"],["company","Company"]].forEach(function(o){
    var b = el("button", S.ui.exScope === o[0] ? "on" : "", o[1]);
    b.onclick = function(){ S.ui.exScope = o[0]; render(); };
    seg.appendChild(b);
  });
  tb.appendChild(seg);
  tb.appendChild(el("div","sp"));
  var add = el("button","btn dark","+ Add expense");
  add.onclick = addExpenseModal;
  tb.appendChild(add);
  v.appendChild(tb);

  var rows = S.data.expenses.slice();
  if (S.ui.exScope === "mine" && S.me) rows = rows.filter(function(x){ return x.person === S.me.id; });
  rows.sort(function(a,b){ return (b.date||"") < (a.date||"") ? -1 : 1; });

  // This month's totals, split by currency — adding CAD to USD makes a
  // number that is wrong in two countries at once.
  var month = today().slice(0,7), sums = {};
  rows.forEach(function(x){ if ((x.date||"").slice(0,7) === month) sums[x.currency] = (sums[x.currency]||0) + x.amount; });
  var head = el("div","seclabel");
  head.appendChild(el("span", null, "This month"));
  var bits = Object.keys(sums).sort().map(function(c){ return fmtMoney(sums[c], c); });
  head.appendChild(el("span","ct", bits.length ? bits.join("  ·  ") : "$0.00"));
  v.appendChild(head);

  if (!rows.length){
    v.appendChild(el("div","empty", S.ui.exScope === "mine"
      ? "Nothing logged yet. The habit is: buy the thing, add it here before the receipt email loads."
      : "No company expenses logged yet."));
    return;
  }
  var wrap = el("div","rows");
  rows.forEach(function(x){
    var r = el("div","row"); r.style.cursor = "default";
    if (S.ui.exScope === "company"){
      var a = el("div","avi", initials(x.person)); a.title = pname(x.person);
      r.appendChild(a);
    }
    var tt = el("div","tt");
    tt.appendChild(el("span","txt", x.title));
    if (x.track) tt.appendChild(el("span","chip proj", tname(x.track)));
    r.appendChild(tt);
    var meta = el("div","meta");
    meta.appendChild(el("span","muted", dayLabel(x.date)));
    var amt = el("span","tabular"); amt.style.fontWeight = "600";
    amt.textContent = fmtMoney(x.amount, x.currency);
    meta.appendChild(amt);
    if (S.me && (x.created_by === S.me.id || isAdmin())){
      var d = el("button","btn quiet","✕"); d.title = "Delete";
      d.onclick = function(e2){
        e2.stopPropagation();
        if (!confirm("Delete this expense — " + x.title + ", " + fmtMoney(x.amount, x.currency) + "?")) return;
        api("/internal/expenses/delete", { body:{ actor_id:S.me.id, expense_id:x.id } })
          .then(refresh).then(render).catch(fail);
      };
      meta.appendChild(d);
    }
    r.appendChild(meta);
    wrap.appendChild(r);
  });
  v.appendChild(wrap);
}

/* ========================= PASSWORD VAULT ================================ */
/* Company logins for tools. The page only ever holds metadata; the secret
   itself is fetched per item, on click, from the reveal route — and what got
   copied is what the server decrypted, not something the page cached. */
function viewVault(v){
  var tb = el("div","toolbar");
  tb.appendChild(el("p","lead","Shared logins for the company's tools. Encrypted at rest; revealed only to signed-in teammates."));
  tb.appendChild(el("div","sp"));
  var add = el("button","btn dark","+ Add login");
  add.onclick = function(){ vaultModal(null); };
  tb.appendChild(add);
  v.appendChild(tb);

  var rows = S.data.passwords.slice();
  if (!rows.length){ v.appendChild(el("div","empty","Nothing in the vault yet. Add the logins the team shares — AWS, Google, Resend, the works.")); return; }
  var wrap = el("div","rows");
  rows.forEach(function(w){
    var r = el("div","row");
    r.onclick = function(){ vaultModal(w); };
    var tt = el("div","tt");
    tt.appendChild(el("span","txt", w.service));
    if (w.username) tt.appendChild(el("span","chip proj", w.username));
    r.appendChild(tt);
    var meta = el("div","meta");
    var cp = el("button","mini","Copy password");
    cp.onclick = function(e2){
      e2.stopPropagation();
      cp.disabled = true; cp.textContent = "…";
      api("/internal/passwords/reveal", { body:{ actor_id:S.me.id, password_id:w.id } })
        .then(function(res){
          var done2 = function(){ cp.textContent = "Copied"; setTimeout(function(){ cp.textContent = "Copy password"; cp.disabled = false; }, 1600); };
          if (navigator.clipboard) navigator.clipboard.writeText(res.secret).then(done2, done2);
          else done2();
        })
        .catch(function(e3){ cp.textContent = "Copy password"; cp.disabled = false; fail(e3); });
    };
    meta.appendChild(cp);
    if (w.url){
      var lk = el("a","mini","Open");
      lk.href = w.url.indexOf("http") === 0 ? w.url : "https://" + w.url;
      lk.target = "_blank"; lk.rel = "noopener noreferrer";
      lk.style.textDecoration = "none";
      lk.onclick = function(e2){ e2.stopPropagation(); };
      meta.appendChild(lk);
    }
    r.appendChild(meta);
    wrap.appendChild(r);
  });
  v.appendChild(wrap);
}

    }

    acts.appendChild(c); acts.appendChild(sb); box.appendChild(acts);
