<template id="main-graphics-template">
  <div
    id="main-graphics"
    data-composition-id="main-graphics"
    data-width="1080"
    data-height="1920"
    data-duration="16"
    data-layout-allow-overflow
    data-layout-ignore
  >
    <div class="grain" data-layout-ignore></div>
    <div class="light-band light-band-a" data-layout-ignore></div>
    <div class="light-band light-band-b" data-layout-ignore></div>

    <div id="scene-1" class="scene active">
      <div class="content">
        <div class="status-row">
          <span class="red-dot"></span>
          <span>payment boundary</span>
        </div>
        <div class="receipt danger">
          <div class="receipt-top">
            <span>checkout</span>
            <span>2:47 am</span>
          </div>
          <div class="item-row">
            <span>black travel umbrella</span>
            <span>$28.00</span>
          </div>
          <div class="rule"></div>
          <div class="blocked">STOPPED BEFORE PAYMENT</div>
          <div class="tiny">card field never touched</div>
        </div>
        <h1>the first AI I trust refused to finish.</h1>
      </div>
    </div>

    <div id="scene-2" class="scene">
      <div class="content">
        <div class="phone">
          <div class="phone-top">
            <span>voice note</span>
            <span>0:06</span>
          </div>
          <div class="wave">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <p>“uh, grab the black umbrella before Seattle”</p>
        </div>
        <div class="caption-strip">messy sentence in. actual task out.</div>
      </div>
    </div>

    <div id="scene-3" class="scene">
      <div class="content cards">
        <div class="task-card">
          <span class="num">01</span>
          <strong>found the item</strong>
          <p>matched “black umbrella” to the open loop</p>
        </div>
        <div class="task-card">
          <span class="num">02</span>
          <strong>cart prepared</strong>
          <p>reversible work only</p>
        </div>
        <div class="task-card stop">
          <span class="num">03</span>
          <strong>payment stopped</strong>
          <p>you press the final button</p>
        </div>
      </div>
    </div>

    <div id="scene-4" class="scene">
      <div class="content boundary">
        <div class="boundary-line">no payment</div>
        <div class="boundary-line">no send</div>
        <div class="boundary-line">no guessing</div>
        <p>just the line.</p>
      </div>
    </div>

    <div id="scene-5" class="scene">
      <div class="content final">
        <div class="receipt safe">
          <div class="receipt-top">
            <span>Anticipy</span>
            <span>local</span>
          </div>
          <div class="blocked">ADMIN CAUGHT</div>
          <div class="tiny">reversible work done. money left to you.</div>
        </div>
        <h2>that is the product.</h2>
        <div class="cta">comment ADMIN for the private setup</div>
      </div>
    </div>

    <div id="wipe" data-layout-ignore></div>
    <div id="blackout" data-layout-ignore></div>

    <style>
      #main-graphics {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #11100d;
        color: #f4efe7;
        font-family: sans-serif;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.18;
        background-image:
          radial-gradient(circle at 10% 20%, rgba(244, 239, 231, 0.09) 0 1px, transparent 1px),
          radial-gradient(circle at 80% 70%, rgba(200, 168, 106, 0.1) 0 1px, transparent 1px);
        background-size: 22px 22px, 31px 31px;
        pointer-events: none;
      }

      .light-band {
        position: absolute;
        width: 1280px;
        height: 190px;
        opacity: 0.2;
        z-index: 0;
      }

      .light-band-a {
        left: -170px;
        top: 96px;
        background: #c8a86a;
        transform: rotate(-9deg);
      }

      .light-band-b {
        right: -210px;
        bottom: 148px;
        background: #c8644f;
        transform: rotate(8deg);
      }

      .scene {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0;
        visibility: hidden;
        display: flex;
      }

      .scene.active {
        opacity: 1;
        visibility: visible;
      }

      .content {
        width: 100%;
        height: 100%;
        padding: 126px 78px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 42px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #c8a86a;
        font-size: 26px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .red-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #c8644f;
        box-shadow: 0 0 26px rgba(200, 100, 79, 0.8);
      }

      h1,
      h2 {
        font-family: serif;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 0.95;
      }

      h1 {
        font-size: 112px;
        max-width: 900px;
      }

      h2 {
        font-size: 128px;
        max-width: 880px;
      }

      .receipt,
      .phone,
      .task-card {
        background: #f4efe7;
        color: #191713;
        border: 2px solid rgba(200, 168, 106, 0.42);
        border-radius: 18px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
      }

      .receipt {
        padding: 34px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        transform-origin: center;
      }

      .receipt-top,
      .item-row,
      .phone-top {
        display: flex;
        justify-content: space-between;
        color: #766f62;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
      }

      .item-row {
        color: #191713;
        text-transform: none;
        letter-spacing: 0;
        font-size: 34px;
      }

      .rule {
        height: 2px;
        background: rgba(25, 23, 19, 0.16);
      }

      .blocked {
        font-size: 58px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
        color: #c8644f;
      }

      .safe .blocked {
        color: #6ea777;
      }

      .tiny {
        color: #766f62;
        font-size: 27px;
      }

      .phone {
        padding: 42px;
        min-height: 560px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .phone p {
        font-family: serif;
        font-size: 76px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .wave {
        height: 170px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .wave i {
        display: block;
        width: 18px;
        border-radius: 999px;
        background: #c8a86a;
      }

      .wave i:nth-child(1) { height: 54px; }
      .wave i:nth-child(2) { height: 126px; }
      .wave i:nth-child(3) { height: 82px; }
      .wave i:nth-child(4) { height: 158px; }
      .wave i:nth-child(5) { height: 96px; }
      .wave i:nth-child(6) { height: 132px; }
      .wave i:nth-child(7) { height: 66px; }
      .wave i:nth-child(8) { height: 112px; }

      .caption-strip,
      .cta {
        align-self: flex-start;
        border-radius: 999px;
        background: #0c0c0c;
        color: #f5f0eb;
        border: 1px solid rgba(244, 239, 231, 0.16);
        padding: 18px 26px;
        font-size: 29px;
        font-weight: 700;
      }

      .cards {
        gap: 26px;
      }

      .task-card {
        padding: 36px 38px;
        min-height: 280px;
        display: grid;
        grid-template-columns: 96px 1fr;
        grid-template-rows: auto auto;
        column-gap: 26px;
        align-content: center;
      }

      .task-card .num {
        grid-row: 1 / span 2;
        color: #c8a86a;
        font-size: 44px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      .task-card strong {
        font-size: 58px;
        line-height: 1;
        letter-spacing: 0;
      }

      .task-card p {
        margin-top: 14px;
        color: #766f62;
        font-size: 29px;
        line-height: 1.2;
      }

      .task-card.stop {
        border-color: rgba(200, 100, 79, 0.74);
      }

      .boundary {
        justify-content: center;
        gap: 34px;
      }

      .boundary-line {
        font-family: serif;
        font-size: 132px;
        line-height: 0.9;
        color: #f4efe7;
      }

      .boundary p {
        margin-top: 22px;
        color: #c8a86a;
        font-size: 42px;
        font-weight: 700;
      }

      .final {
        justify-content: center;
      }

      #wipe {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #f4efe7;
        transform: translateY(105%);
      }

      #blackout {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: #11100d;
        opacity: 0;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 16;

      tl.to(".light-band-a", { x: 34, y: 18, duration: D, ease: "sine.inOut" }, 0);
      tl.to(".light-band-b", { x: -28, y: -30, duration: D, ease: "sine.inOut" }, 0);

      function enter(scene, at) {
        tl.set(".scene", { opacity: 0, visibility: "hidden" }, at);
        tl.set(scene, { opacity: 1, visibility: "visible" }, at);
      }

      function wipe(at) {
        tl.fromTo("#wipe", { yPercent: 105 }, { yPercent: -105, duration: 0.42, ease: "power3.inOut" }, at);
      }

      enter("#scene-1", 0);
      tl.from("#scene-1 .status-row", { y: 24, opacity: 0, duration: 0.44, ease: "power2.out" }, 0.16);
      tl.from("#scene-1 .receipt", { y: 58, rotate: -2.5, opacity: 0, duration: 0.58, ease: "back.out(1.6)" }, 0.22);
      tl.from("#scene-1 h1", { y: 46, opacity: 0, duration: 0.62, ease: "expo.out" }, 0.66);
      tl.to(".red-dot", { scale: 1.45, duration: 0.36, repeat: 8, yoyo: true, ease: "sine.inOut" }, 0.1);

      wipe(2.7);
      enter("#scene-2", 2.92);
      tl.from("#scene-2 .phone", { y: 70, scale: 0.97, opacity: 0, duration: 0.62, ease: "power4.out" }, 3.02);
      tl.from("#scene-2 .wave i", { scaleY: 0.18, opacity: 0, duration: 0.52, stagger: 0.045, ease: "back.out(2)" }, 3.28);
      tl.from("#scene-2 .phone p", { y: 32, opacity: 0, duration: 0.52, ease: "expo.out" }, 3.8);
      tl.from("#scene-2 .caption-strip", { x: -40, opacity: 0, duration: 0.46, ease: "power2.out" }, 4.38);

      wipe(5.85);
      enter("#scene-3", 6.07);
      tl.from("#scene-3 .task-card:nth-child(1)", { x: -54, rotate: -1, opacity: 0, duration: 0.52, ease: "power3.out" }, 6.2);
      tl.from("#scene-3 .task-card:nth-child(2)", { x: 54, rotate: 1, opacity: 0, duration: 0.52, ease: "back.out(1.4)" }, 6.68);
      tl.from("#scene-3 .task-card:nth-child(3)", { y: 54, scale: 0.96, opacity: 0, duration: 0.58, ease: "expo.out" }, 7.16);

      wipe(9.15);
      enter("#scene-4", 9.37);
      tl.from("#scene-4 .boundary-line:nth-child(1)", { x: -58, opacity: 0, duration: 0.48, ease: "power3.out" }, 9.5);
      tl.from("#scene-4 .boundary-line:nth-child(2)", { x: 58, opacity: 0, duration: 0.48, ease: "back.out(1.5)" }, 10.02);
      tl.from("#scene-4 .boundary-line:nth-child(3)", { y: 46, opacity: 0, duration: 0.5, ease: "expo.out" }, 10.54);
      tl.from("#scene-4 p", { y: 26, opacity: 0, duration: 0.42, ease: "power2.out" }, 11.08);

      wipe(12.05);
      enter("#scene-5", 12.27);
      tl.from("#scene-5 .receipt", { y: 68, rotate: 2, opacity: 0, duration: 0.56, ease: "back.out(1.7)" }, 12.42);
      tl.from("#scene-5 h2", { y: 42, opacity: 0, duration: 0.58, ease: "expo.out" }, 13.08);
      tl.from("#scene-5 .cta", { y: 30, opacity: 0, duration: 0.44, ease: "power2.out" }, 13.72);
      tl.to("#blackout", { opacity: 1, duration: 0.36, ease: "power2.in" }, 15.64);

      window.__timelines["main-graphics"] = tl;
    </script>
  </div>
</template>
