# Factory operational caps. Sourced by bash. Values are DEFAULTS — a pre-set
# environment variable always wins (set-if-unset + export), so tests and the
# foreman can override per-run without editing this file.
: "${BUILD_WALL_CAP_SECONDS:=2400}";  export BUILD_WALL_CAP_SECONDS
: "${JUDGE_WALL_CAP_SECONDS:=1200}";  export JUDGE_WALL_CAP_SECONDS
: "${BUILD_MODEL:=}";                 export BUILD_MODEL
: "${JUDGE_MODEL:=}";                 export JUDGE_MODEL
: "${TREADMILL_K:=5}";                export TREADMILL_K
: "${TREADMILL_SAME_METRIC_TRIES:=3}"; export TREADMILL_SAME_METRIC_TRIES
: "${PERSONA_PORT_BASE:=8801}";       export PERSONA_PORT_BASE
: "${PERSONA_PARALLEL:=1}";           export PERSONA_PARALLEL
: "${ENGINE_BOOT_TIMEOUT_SECONDS:=45}"; export ENGINE_BOOT_TIMEOUT_SECONDS
: "${DAY_POST_TIMEOUT_SECONDS:=240}"; export DAY_POST_TIMEOUT_SECONDS
: "${JUDGE_SELFCHECK_EVERY_DAYS:=7}"; export JUDGE_SELFCHECK_EVERY_DAYS
: "${NIGHTLY_STOP_HOUR:=7}";          export NIGHTLY_STOP_HOUR
