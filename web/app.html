<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anticipy — The Board</title>
  <meta name="description" content="The calm room. Hand over your day; the loose ends close behind you. Anticipy never spends your money, or your trust, without asking." />
  <meta name="theme-color" content="#F5F1E8" />
  <link rel="icon" href="data:," />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Shared design system (tokens + welcome-page classes) -->
  <link rel="stylesheet" href="styles.css" />
  <!-- The sign-in / sign-up gate -->
  <link rel="stylesheet" href="auth.css" />
  <!-- App-only additions -->
  <link rel="stylesheet" href="app.css" />

  <!-- Supabase client (public anon key only — safe in static JS) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Same atmosphere as the welcome page -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <a class="wordmark" href="index.html" aria-label="Anticipy home">ANTICIPY</a>
    <span class="topbar-date">
      the day <span class="topbar-date-val" data-today>·</span>
    </span>
    <nav class="an-topnav" aria-label="Sections">
      <a href="app.html" class="active">Tasks</a>
      <a href="mp3.html">Upload</a>
      <a href="settings.html">Settings</a>
    </nav>
    <span class="auth-chip-slot" data-auth-chip></span>
  </header>
  <style>
    .an-topnav { display:inline-flex; gap:.2rem; margin-left:1rem; }
    .an-topnav a { font:500 .82rem/1 "Inter",sans-serif; color:#4A4641; text-decoration:none;
      padding:.4rem .75rem; border-radius:999px; }
    .an-topnav a:hover { background:#F5F1E8; color:#171615; }
    .an-topnav a.active { background:#171615; color:#FBF9F4; }
  </style>

  <main class="app-shell" id="top">

    <!-- ===================== ZONE 1 · LISTEN / PASTE ===================== -->
    <section class="listen" aria-label="Hand over your day">
      <div class="listen-card">
        <p class="eyebrow">What happened today</p>

        <label class="sr-only" for="listen-field">Paste your day</label>
        <div class="listen-field-wrap" data-listen-wrap>
          <textarea
            id="listen-field"
            class="listen-field"
            rows="3"
            placeholder="Paste your day, or just start talking it out — the venting, the “ugh I still have to,” all of it."
            aria-label="Paste your day"
          ></textarea>
          <span class="listen-underline" aria-hidden="true"></span>
        </div>

        <div class="listen-footer">
          <button class="mic-btn" type="button" data-listen aria-pressed="false" aria-label="Tap to talk">
            <svg class="mic-ico" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <path fill="currentColor" d="M12 14.5a3.25 3.25 0 0 0 3.25-3.25V6a3.25 3.25 0 1 0-6.5 0v5.25A3.25 3.25 0 0 0 12 14.5z"/>
              <path fill="currentColor" d="M18.75 11.25a.95.95 0 1 0-1.9 0 4.85 4.85 0 0 1-9.7 0 .95.95 0 1 0-1.9 0 6.75 6.75 0 0 0 5.8 6.68V20.4H8.4a.95.95 0 1 0 0 1.9h7.2a.95.95 0 1 0 0-1.9h-2.65v-2.47a6.75 6.75 0 0 0 5.8-6.68z"/>
            </svg>
            <span class="mic-label" data-mic-label>Tap to talk</span>
          </button>
          <button class="listen-submit" type="button" data-submit>Hand it over <span class="arrow" aria-hidden="true">&rarr;</span></button>
        </div>
      </div>
    </section>

    <!-- ===================== ZONE 2 · THE DECK ===================== -->
    <section class="deck-zone" aria-label="Your cards">
      <div class="deck" data-deck aria-live="polite"></div>

      <!-- empty / engine states render into here -->
      <div class="empty-room" data-empty hidden></div>

      <!-- the four verbs live under the deck, stable across cards -->
      <div class="action-row" data-actions hidden></div>

      <!-- humble ignored-line note + inline status -->
      <p class="deck-aside" data-aside hidden></p>
    </section>

  </main>

  <!-- ===================== ZONE 3 · AUTONOMY DIAL ===================== -->
  <aside class="autonomy-dial" data-dial aria-label="Autonomy">
    <p class="eyebrow dial-eyebrow">Autonomy</p>

    <div class="dial-track" data-dial-track>
      <span class="dial-node" data-dial-node></span>
      <button class="dial-stop" type="button" data-mode="limited" style="left:0%">
        <span class="mode-label">Limited</span>
      </button>
      <button class="dial-stop dial-stop--mid" type="button" data-mode="regular" style="left:50%">
        <span class="mode-label">Regular <span class="recommended">· recommended</span></span>
      </button>
      <button class="dial-stop dial-stop--end" type="button" data-mode="full_send" style="left:100%">
        <span class="mode-label">Full-Send</span>
      </button>
    </div>

    <p class="dial-desc" data-dial-desc>Handles the small, safe things. Asks on what matters.</p>
    <p class="dial-brake" data-dial-brake hidden>Money and irreversible still always ask.</p>
  </aside>

  <!-- Mobile autonomy pill + sheet -->
  <div class="dial-pill" data-dial-pill>
    <button class="dial-pill-btn" type="button" data-dial-pill-btn>
      <span class="eyebrow dial-eyebrow">Autonomy</span>
      <span class="dial-pill-mode" data-dial-pill-mode>Regular</span>
    </button>
  </div>
  <div class="dial-sheet" data-dial-sheet hidden>
    <div class="dial-sheet-scrim" data-dial-sheet-scrim></div>
    <div class="dial-sheet-panel">
      <p class="eyebrow dial-eyebrow">Autonomy</p>
      <button class="dial-sheet-stop" type="button" data-mode="limited">
        <span class="mode-label">Limited</span>
        <span class="dial-sheet-desc">Prepares everything. Acts only on your yes.</span>
      </button>
      <button class="dial-sheet-stop" type="button" data-mode="regular">
        <span class="mode-label">Regular <span class="recommended">· recommended</span></span>
        <span class="dial-sheet-desc">Handles the small, safe things. Asks on what matters.</span>
      </button>
      <button class="dial-sheet-stop" type="button" data-mode="full_send">
        <span class="mode-label">Full-Send</span>
        <span class="dial-sheet-desc">Moves fast for you — still stops for money and the irreversible.</span>
      </button>
    </div>
  </div>

  <!-- Shared auth path (Supabase client + helpers), then the gate, then the app -->
  <script src="auth.js"></script>
  <script src="auth-screen.js"></script>
  <script src="app.js?v=20260626b"></script>
</body>
</html>
