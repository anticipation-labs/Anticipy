name: iOS TestFlight
on:
  push:
    branches: [jose_anticipy_system]
    paths: ['app/ios/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPMENT_TEAM: "49T86P9XGW"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26 (Apple requires the iOS 26 SDK for uploads)
        run: |
          ls /Applications | grep -i xcode || true
          X26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $X26"
          sudo xcode-select -s "$X26"
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: app/ios
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p $RUNNER_TEMP/asc $HOME/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_P8" | base64 --decode -o $RUNNER_TEMP/asc/AuthKey.p8
          cp $RUNNER_TEMP/asc/AuthKey.p8 $HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Bump build number above Apple's latest
        working-directory: app/ios
        run: xcrun agvtool next-version -all || echo "agvtool bump skipped"
      - name: Archive (cloud signing — Apple holds the key)
        working-directory: app/ios
        run: |
          xcodebuild archive \
            -project Anticipy.xcodeproj -scheme Anticipy \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Anticipy.xcarchive \
            DEVELOPMENT_TEAM=49T86P9XGW CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Export and upload to TestFlight
        working-directory: app/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Anticipy.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            DEVELOPMENT_TEAM=49T86P9XGW CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          xcrun altool --upload-app -t ios -f $RUNNER_TEMP/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
