name: iOS TestFlight
#
# THE UPLOAD IS ASKED FOR, NOT AUTOMATIC (2026-09-06).
#
# Every push touching app/ios/** used to upload a build. On 2026-09-06 five
# such pushes landed inside fifty minutes, and the fifth one got Apple's
# answer for all of them:
#
#     Validation failed (409) Upload limit reached. The upload limit for your
#     application has been reached. Please wait 1 day and try again.
#
# WHAT THAT LIMIT IS, AND WHAT IT IS NOT (owner, 2026-09-06 -- an earlier
# version of this note got it wrong and the wrong version is worse than none):
#
#   * It is the BINARY UPLOAD THROTTLE (ITMS-90382 / ITMS-90383), on a rolling
#     24-hour window measured from the first upload in it. Not a daily quota
#     that resets at midnight.
#   * It is NOT the six-per-day TestFlight App Review submission cap. Internal
#     testers skip review entirely, so that cap does not apply to this app at
#     all: an internal build is installable the moment processing finishes.
#   * BURSTS TRIP IT FASTER THAN THE RAW COUNT. Space uploads 10-15 minutes
#     apart when several go out in a row.
#   * Bumping the MARKETING version (not just the build number) and retrying
#     is the documented way through when it does bite. Failing that it is a
#     wait, or a ticket with Apple Developer Support, who can reset it.
#   * Internal builds expire after 90 days, and an expired build frees no
#     upload headroom.
#
# Four consecutive runs failed at the same step. Build 156 stayed the newest
# thing any tester could install while the fix they had reported -- "stop
# actually stops" -- sat finished in the tree, unshippable. A per-commit
# upload spends the window on intermediate commits and has nothing left for
# the one somebody is waiting on.
#
# So a push BUILDS and runs the logic gate, which is what catches a broken
# tree; it uploads only when somebody asks for a build, either by dispatching
# this workflow by hand or by putting [ship] in the commit message. Two or
# three internal builds a day is plenty. For a tight iteration loop, run to a
# device from Xcode instead -- that touches no counter at all.
#
# The final step says plainly which of the two happened, so a push that
# deliberately did not ship never reads as a build that silently vanished.
on:
  push:
    # The iOS source of record is cloudflare-backend. This used to fire on
    # jose_anticipy_system, a branch 165 commits behind, and uploaded the
    # 121-era tree as TestFlight 122 and 123; one more push there after the
    # Cloudflare build ships would have overtaken it on every tester's
    # phone as 126+ (audit F38, 2026-09-05).
    branches: [cloudflare-backend]
    paths: ['app/ios/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:

# Every runner gets a different ephemeral signing identity. Serializing this
# job makes it safe to retire only earlier runners' API-created identities.
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPMENT_TEAM: "49T86P9XGW"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build-number leg below reads `git log -G` for the commit that
          # last moved CURRENT_PROJECT_VERSION; on a shallow clone it finds
          # nothing and exits 2 ("an empty search is not a pass").
          fetch-depth: 0
      - name: Use Xcode 26 (Apple requires the iOS 26 SDK for uploads)
        run: |
          ls /Applications | grep -i xcode || true
          X26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $X26"
          sudo xcode-select -s "$X26"
          xcodebuild -version
      - name: Is this a ship?
        id: ship
        env:
          # THROUGH THE ENVIRONMENT, NEVER INTERPOLATED INTO THE SCRIPT. A
          # commit message is attacker-controlled text; `${{ }}` pasted into a
          # `run:` body is command injection with a push as the delivery.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        # ONE ANSWER, READ BY EVERY STEP BELOW. A condition repeated on four
        # steps is four chances for them to disagree, and the disagreement
        # that matters here -- archiving but not uploading, or uploading a
        # tree the gate never checked -- is invisible until a tester is stuck
        # on an old build.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ship=yes" >> "$GITHUB_OUTPUT"
            echo "This run was dispatched by hand: it will upload."
          elif printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -q '\[ship\]'; then
            echo "ship=yes" >> "$GITHUB_OUTPUT"
            echo "The commit message carries [ship]: it will upload."
          else
            echo "ship=no" >> "$GITHUB_OUTPUT"
            echo "No [ship] in the commit message and not a manual dispatch:"
            echo "this run builds and tests, and uploads NOTHING. Apple's daily"
            echo "upload limit is small enough that spending it on every commit"
            echo "leaves none for the commit somebody is waiting on."
          fi

      - name: iOS logic gate — the suites, and that the build number still names these bytes
        # Nothing ran app/ios/Tests/run_all.sh before an upload: it was a
        # hand step, and the tree carried its last leg red into a release
        # (audit F21). Before xcodegen and before the bump, so the leg reads
        # the committed pbxproj and the committed number.
        run: sh app/ios/Tests/run_all.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: app/ios
        run: xcodegen generate
      - name: Write App Store Connect API key
        if: steps.ship.outputs.ship == 'yes'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p $RUNNER_TEMP/asc $HOME/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_P8" | base64 --decode -o $RUNNER_TEMP/asc/AuthKey.p8
          cp $RUNNER_TEMP/asc/AuthKey.p8 $HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Clear orphaned cloud-signing certificates
        if: steps.ship.outputs.ship == 'yes'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: |
          python3 app/ios/scripts/app_store_connect.py free-signing-slot
      - name: Build number — the source's, unless Apple already holds it
        if: steps.ship.outputs.ship == 'yes'
        working-directory: app/ios
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: |
          source=$(xcrun agvtool what-version -terse | head -1)
          # READ, NEVER REMEMBERED. This was the literal 1.1.0 while the
          # project carried whatever it carried, and the two only have to
          # disagree once: next-build asks Apple which build numbers are taken
          # UNDER A MARKETING VERSION, so a stale literal here asks about the
          # wrong train and answers "nothing collides" about a version nobody
          # is uploading. Bumping the marketing version is also the documented
          # way past an upload throttle, which makes drift here likely rather
          # than theoretical.
          # NOT agvtool. `agvtool what-marketing-version -terse1` reads
          # CFBundleShortVersionString out of the Info.plist, and this project
          # sets that to the literal "$(MARKETING_VERSION)" -- agvtool answers
          # with the unexpanded reference, which would be passed to Apple as a
          # version string and match nothing. xcodebuild resolves it.
          marketing=$(xcodebuild -project Anticipy.xcodeproj -scheme Anticipy \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/^ *MARKETING_VERSION = /{print $2; exit}')
          case "$marketing" in
            ""|*'$('*)
              echo "::error::could not resolve MARKETING_VERSION (got '$marketing')"
              exit 1 ;;
          esac
          echo "marketing version $marketing, source build $source"
          next=$(python3 scripts/app_store_connect.py next-build \
            --bundle ai.anticipy.app --marketing "$marketing" --source "$source")
          echo "ANTICIPY_UPLOAD_BUILD=$next" >> "$GITHUB_ENV"
          # The tree's number is what device_id iphone-b<CFBundleVersion> and
          # the ledgers name, so it is rewritten only on a collision (audit
          # F22: the old unconditional +1 labelled 119→121, 121→122, 121→123).
          if [ "$next" = "$source" ]; then
            echo "Source build $source is above every build Apple holds; uploading as $source"
          else
            echo "Source build $source collides with App Store Connect; uploading as $next"
            xcrun agvtool new-version -all "$next"
          fi
      - name: Archive (cloud signing — Apple holds the key)
        if: steps.ship.outputs.ship == 'yes'
        working-directory: app/ios
        run: |
          xcodebuild archive \
            -project Anticipy.xcodeproj -scheme Anticipy \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Anticipy.xcarchive \
            DEVELOPMENT_TEAM=49T86P9XGW CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Export and upload to TestFlight
        if: steps.ship.outputs.ship == 'yes'
        working-directory: app/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Anticipy.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            DEVELOPMENT_TEAM=49T86P9XGW CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          # THE GATE THAT WAS MISSING: altool printed "Failed to upload
          # package / STATE_ERROR.VALIDATION_ERROR" and still exited 0 —
          # the run read green while Apple received nothing. The pipeline
          # verdict must be Apple's verdict, so grep it out of altool's own
          # mouth and fail the step if the words are not there.
          set -o pipefail
          out=$(xcrun altool --upload-app -t ios -f $RUNNER_TEMP/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "UPLOAD SUCCEEDED" || {
            # NAME THE ONE REFUSAL THAT IS NOT A DEFECT. A 409 "Upload limit
            # reached" is Apple rate-limiting the account, not a bad archive:
            # nothing in the tree can fix it and re-running only spends
            # another attempt. Saying "Apple refused the upload" for it sent
            # four runs' worth of people looking for a signing problem.
            if printf '%s' "$out" | grep -q "Upload limit reached"; then
              echo "::error::Apple's BINARY UPLOAD THROTTLE (ITMS-90382/90383) is tripped for ai.anticipy.app. The archive is fine and this is not a code defect, and it is not the TestFlight review cap - internal testers skip review. It is a rolling 24-hour window from the first upload in it. Bump MARKETING_VERSION and re-run this workflow by hand, or wait the window out; pushing more commits only spends more attempts, and bursts trip it faster than the count does."
            else
              echo "::error::Apple refused the upload — see the validation error above"
            fi
            exit 1
          }
      - name: Wait for Apple's TestFlight processing verdict
        if: steps.ship.outputs.ship == 'yes'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: |
          python3 app/ios/scripts/app_store_connect.py wait-build \
            --bundle ai.anticipy.app --build "$ANTICIPY_UPLOAD_BUILD"

      - name: Say what this run did
        if: always()
        run: |
          if [ "${{ steps.ship.outputs.ship }}" = "yes" ]; then
            echo "Shipped: build $ANTICIPY_UPLOAD_BUILD was offered to App Store Connect."
          else
            echo "Built and tested only. Nothing was uploaded."
            echo "To ship this tree: gh workflow run ios-testflight.yml --ref ${{ github.ref_name }}"
          fi
