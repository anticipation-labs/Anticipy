name: Backend deployment (API or brain)

# Builds the brain image and deploys the OwnerBrain + BrainSupervisor Workers to
# Cloudflare Containers, per migration/BRAIN-ON-CONTAINERS.md. The image is built
# REMOTELY by Cloudflare's builder (wrangler uploads the build context), so no
# Docker daemon is needed on any laptop — this is why the migration goes through
# CI, not a local machine.
#
# ORDER (runbook §10.6): first deploy runs with max_instances=1 and
# ANTICIPY_MAX_OWNER_WORKERS=1 so ONE non-founder owner is exercised before the
# fleet. Raise the caps in a later, deliberate run once the single owner is
# proven healthy. Run brain-state-to-r2.yml FIRST — the container pulls each
# owner's memory.db from R2 on boot and aborts loudly if it is missing.
#
# REQUIRED REPO SECRETS:
#   CLOUDFLARE_API_TOKEN   - Workers + Containers + R2 + D1 edit
#   CLOUDFLARE_ACCOUNT_ID  - 114587b715e702461766369b01d42fc7
# Plus the 15 brain secrets (§5.2) must already be set on the anticipy-brain
# Worker via `wrangler secret put` (this workflow does NOT print or handle them).

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Backend component to deploy'
        required: true
        type: choice
        options: [brain, api, inspect, inspect-api, messaging-secret]
        default: brain
      confirm:
        description: 'Type DEPLOY to deploy the selected component'
        required: true
        default: ''
      cap:
        description: 'ANTICIPY_MAX_OWNER_WORKERS / max_instances (start at 1)'
        required: true
        default: '1'

concurrency:
  group: ${{ github.event.inputs.component == 'inspect' && 'backend-inspect' || 'brain-deploy' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/cloudflare-backend' && github.event.inputs.confirm == 'DEPLOY' && github.event.inputs.component == 'brain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_CAP: ${{ github.event.inputs.cap }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Install wrangler + containers SDK
        working-directory: migration/workers/brain
        run: |
          npm ci
          npm ci --prefix ..
          echo "$GITHUB_WORKSPACE/migration/workers/node_modules/.bin" >> "$GITHUB_PATH"
          ../node_modules/.bin/wrangler --version
          npm test
          npm run typecheck

      - name: Pre-flight — every owner this deploy will serve has state in R2 (the container aborts without it)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Audit F46 (2026-09-05): this step used to `wc -l` a single object
          # that does not exist and passed on 0. The container refuses to boot
          # for an owner whose memory.db is not in R2 (brain/container_entry.py),
          # so the check is per owner: everyone the allowlist names must have
          # owners/<id>/memory.db, or this deploy is refused here, not in a
          # crash loop. Discovery-served owners are checked when the cap allows any.
          allow=$(grep -oE '"ANTICIPY_SERVE_OWNERS": *"[^"]*"' migration/config/wrangler.brain.jsonc | sed -E 's/.*: *"([^"]*)"/\1/' | tr ',' ' ')
          cap="$DEPLOY_CAP"
          missing=0; checked=0
          for ref in $allow; do
            ref=$(echo "$ref" | tr -d ' '); [ -n "$ref" ] || continue
            checked=$((checked+1))
            if wrangler r2 object get "anticipy-owner-state/owners/$ref/memory.db" --remote --pipe >/dev/null 2>&1; then
              echo "owner $ref: memory.db present in R2"
            else
              echo "owner $ref: NO memory.db in R2 — the container would abort at boot"; missing=$((missing+1))
            fi
          done
          echo "allowlist owners checked: $checked, missing: $missing, cap: $cap"
          if [ "$missing" -gt 0 ]; then echo "REFUSING: run brain-state-to-r2.yml for the missing owner(s) first"; exit 1; fi
          if [ "$cap" != "0" ]; then echo "cap $cap > 0: discovery-served owners are NOT pre-checked here; research/2026-09-05-brain-of-record.md says the allowlist, not the cap, chooses who moves"; fi
      - name: Deploy brain (remote container build — no local Docker)
        run: |
          set -euo pipefail
          cap="$DEPLOY_CAP"
          [[ "$cap" =~ ^[0-9]+$ ]] && [ "$cap" -le 100 ] || { echo "Invalid capacity"; exit 1; }
          echo "Deploying anticipy-brain with discovery cap = $cap"
          runtime_source=$(python3 -c 'from brain.runtime_status import source_hash; print(source_hash())')
          # wrangler builds the image from brain/Dockerfile remotely and deploys
          # OwnerBrain + BrainSupervisor. --containers-rollout gradual is the safe
          # default; the first run should be cap=1.
          wrangler deploy \
            --config migration/config/wrangler.brain.jsonc \
            --keep-vars \
            --tag "$GITHUB_SHA" \
            --var ANTICIPY_MAX_OWNER_WORKERS:"$cap" \
            --var ANTICIPY_EXPECTED_RUNTIME_SOURCE:"$runtime_source" \
            --containers-rollout immediate

      - name: Verify the active fleet, running source and current memory snapshots
        env:
          ANTICIPY_INTERNAL_KEY: ${{ secrets.ANTICIPY_INTERNAL_KEY }}
        run: python3 -m proof.audit.live_brain_release

  api:
    if: ${{ github.ref == 'refs/heads/cloudflare-backend' && github.event.inputs.confirm == 'DEPLOY' && github.event.inputs.component == 'api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test the API source that will be deployed
        working-directory: migration/workers
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run stage:assets
          npm run check:assets
      - name: Apply the non-destructive account erasure write fence
        working-directory: migration/workers
        run: npx --no-install wrangler d1 execute anticipy-backend --remote --config wrangler.jsonc --file ../d1/2026-09-07-account-erasure-fence.sql
      - name: Apply the connection command retry fence
        working-directory: migration/workers
        run: npx --no-install wrangler d1 execute anticipy-backend --remote --config wrangler.jsonc --file ../d1/2026-09-07-connection-command-runs.sql
      - name: Deploy the API while preserving separately configured provider variables
        working-directory: migration/workers
        run: npx --no-install wrangler deploy --config wrangler.jsonc --keep-vars --tag "$GITHUB_SHA"
      - name: Verify the active version and exercise signup, ownership and deletion over the live URL
        env:
          ANTICIPY_INTERNAL_KEY: ${{ secrets.ANTICIPY_INTERNAL_KEY }}
        run: python proof/audit/live_api_release.py --base https://api.anticipy.ai --verify-deployment

  messaging-secret:
    if: ${{ github.ref == 'refs/heads/cloudflare-backend' && github.event.inputs.confirm == 'DEPLOY' && github.event.inputs.component == 'messaging-secret' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENDBLUE_WEBHOOK_SECRET: ${{ secrets.SENDBLUE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install only the webhook secret and verify live authentication without a message
        run: python3 proof/audit/configure_sendblue_webhook.py

  inspect:
    if: ${{ github.ref == 'refs/heads/cloudflare-backend' && github.event.inputs.component == 'inspect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read deployed database structure without customer rows
        run: python3 -m proof.audit.live_schema
      - name: Read container rollout and instance metadata without environment values
        run: python3 -m proof.audit.live_container_inspect
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Observe one minute of lifecycle errors without customer content
        run: |
          npm ci --prefix migration/workers --ignore-scripts
          set +e
          timeout 75s migration/workers/node_modules/.bin/wrangler tail anticipy-brain --format json > "$RUNNER_TEMP/brain-tail.json" 2> "$RUNNER_TEMP/brain-tail-stderr.txt"
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then
            echo "Read-only log observation failed with exit $result"
            exit "$result"
          fi
          python3 proof/audit/container_log_summary.py "$RUNNER_TEMP/brain-tail.json"

  inspect-api:
    if: ${{ github.ref == 'refs/heads/cloudflare-backend' && github.event.inputs.component == 'inspect-api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install the existing deployment CLI
        run: npm ci --prefix migration/workers --ignore-scripts
      - name: Observe webhook response codes without message content
        run: |
          set +e
          timeout 125s migration/workers/node_modules/.bin/wrangler tail anticipy-api --format json > "$RUNNER_TEMP/api-tail.json" 2> "$RUNNER_TEMP/api-tail-stderr.txt"
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then
            echo "Read-only API observation failed with exit $result"
            exit "$result"
          fi
          python3 proof/audit/messaging_log_summary.py "$RUNNER_TEMP/api-tail.json"
