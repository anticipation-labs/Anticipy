name: Anticipy
options:
  bundleIdPrefix: ai.anticipy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "16"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Anticipy:
    type: application
    platform: iOS
    sources:
      - Anticipy
    info:
      path: Anticipy/Info.plist
      properties:
        CFBundleDisplayName: Anticipy
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "16"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSBluetoothAlwaysUsageDescription: Anticipy connects to your pendant over Bluetooth to hear your day.
        NSMicrophoneUsageDescription: Anticipy uses the microphone for on-device transcription.
        NSSpeechRecognitionUsageDescription: Anticipy transcribes speech on-device when Local mode is on.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.pendant
