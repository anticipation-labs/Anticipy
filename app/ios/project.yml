name: Anticipy
options:
  bundleIdPrefix: ai.anticipy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "52"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Anticipy:
    type: application
    platform: iOS
    sources:
      - Anticipy
    info:
      path: Anticipy/Info.plist
      properties:
        CFBundleDisplayName: Anticipy Codex Version
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "52"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSBluetoothAlwaysUsageDescription: Anticipy Codex Version connects to your pendant over Bluetooth. When it is connected, pendant audio is sent to Deepgram for live transcription. Only needed if you have a pendant.
        # These describe what actually happens: capture continues in the
        # background, and the resulting TEXT is sent to Anticipy's server so she
        # can act on it. The old strings promised "on-device transcription" and
        # referenced a "Local mode" that gated nothing and appeared nowhere.
        NSMicrophoneUsageDescription: Anticipy Codex Version listens through your microphone, including while the app is in the background, so she can catch what you commit to. Audio stays on your phone; the words are sent to Anticipy Codex Version so she can act on them. You control when she is listening.
        NSSpeechRecognitionUsageDescription: Anticipy Codex Version turns what she hears into text on your phone, then sends that text to Anticipy Codex Version so she can remember it and act on it.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Arbitrary loads is gone: everything the app talks to is HTTPS. Local
          # networking stays permitted for a developer pointing at a LAN backend.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.app
