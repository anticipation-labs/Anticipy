name: Anticipy
options:
  bundleIdPrefix: ai.anticipy
  deploymentTarget:
    iOS: "16.0"
# Pinned by REVISION, not tag or version: no sherpa-onnx tag contains
# Package.swift, so a from/exactVersion pin cannot resolve at all. The hash
# matches swiftpm/Package.resolved, which already carried this pin while the
# target linked nothing.
# NO PACKAGES. The one that used to be here is sherpa-onnx, and it is out for
# the second time — see the target's `dependencies` note below for why, and for
# exactly what it costs and how to put it back.
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    VERSIONING_SYSTEM: apple-generic
    # docs ex 111: "Bump the version when the bytes change." Five behaviour
    # commits landed (ex 77, 78, 83, 87, 88, 90), and the brief records build 63
    # as already shipped while this file still said 62 - so 62 would also have
    # been refused by App Store Connect as a used build number.
    #
    # 66: the app has a light mode, and opens in it. The root used to pin
    # .preferredColorScheme(.dark). A behaviour change that leaves the build
    # number alone is also unprovable on a device - "is 65 the 65 I just
    # installed?" has no answer.
    #
    # 67: light is WHITE and dark is BLACK, and onboarding can no longer strand
    # anyone. `hasOnboarded` used to be written at the tail of a ~2.4s animation
    # inside OnboardingView; an interrupted animation meant repeating all five
    # steps forever with the profile already saved. The flag is now written the
    # moment the last step clears, and the celebration is a transient overlay
    # owned by AnticipyApp that records nothing.
    #
    # 68: day zero. She now asks about your life instead of guessing at it - six
    # questions (`Interview.swift`), and just-in-time asks for the two sources
    # that live on this phone, calendar and contacts, each with its own consent
    # and its own stated reason. The browser step leaves first run and is offered
    # when an errand actually needs hands. Deleting everything on the server is
    # a button rather than an apology and a mailto.
    #
    # 69: the supervised read. She can read a page you opened - your mailbox,
    # your LinkedIn - and distil it into what she knows, but ONLY while you are
    # watching: the phone stamps `jobs.watching_until` every ten seconds from the
    # foreground, and the extension re-checks it before every action. Lock the
    # phone and the read stops itself. The action vocabulary is per source and
    # default-deny (mail may navigate; professional may only extract, because
    # LinkedIn's UA 8.2 turns on who navigates). Facts from a mailbox are written
    # by other people, so they are fenced like an imported calendar title and
    # capped at importance 4 - and cannot crowd the owner's own words out of a
    # prompt.
    #
    # 70: the name is just Anticipy - the "Claude Version" suffix is gone from
    # every surface, including two places a rename pass cannot see (the phrase
    # split across a source line break, and one upper-case wordmark). Every
    # button and link is now the owner's Liquid Glass material: a pill, a
    # vertical fill, a lit top rim, a shaded floor, a cast thrown far enough to
    # read as height, and a shine that crosses once on press. Light is the dark
    # glass the component ships; dark inverts to light metal, because a
    # near-black button on a true-black page is invisible. The champagne bloom
    # is gone from all seven remaining views.
    #
    # 71: no vertical champagne rules anywhere. Twelve of them: nine drawn in
    # accentDim and three in accent, which a grep for the dim token could not
    # see. Two were carrying information rather than decoration and kept the
    # signal in type instead of an edge; one, on a transcript row, turned out to
    # be the third telling of a moment the haptic and the springing label had
    # already made. Also: no star on a Found card, and no em dash in anything a
    # person reads (the ~540 in code comments are left alone, deliberately).
    #
    # 72: two more of the owner's components. Glassy-button gives the two
    # glyph-only controls a machined face with a real PRESSED state (the cast
    # tightens rather than the button shrinking) and, at last, a real DISABLED
    # one - the send arrow used to express refusal three times over, none of
    # them the material's. Text-Arrow-CTA gives forward links an arrow that
    # swaps sides rather than sliding, and an underline that wipes in two
    # staggered halves. No click sound: she never comes to the foreground on her
    # own, and a tap already has a haptic.
    #
    # 73: the icon button was black. Its face was wired to glassTop/glassBottom
    # on the reasoning that the component's shell ramp IS the light metal this
    # file already decomposed - true of those tokens' DARK values, false of
    # their light ones, which are the Glass CTA's near-black #26262A -> #08080A.
    # So an icon button on a white page wore the primary pill's fill. The
    # component has ONE appearance, light metal, and now has its own tokens for
    # it. Also: its cast floor sat 15pt below a 44pt control, a third of its own
    # height, which read as a second pale plate lying under the button instead
    # of as its shadow.
    #
    # 74: the two things 73 claimed and did not deliver, both found by finally
    # getting Home on a screen instead of reasoning about it.
    #
    # The logo was off-centre because the leading toolbar item was the mark plus
    # a 24pt serif wordmark, and the wordmark never rendered - the slot is too
    # narrow once the trailing control takes its share, so the system truncated
    # the text to nothing while the HStack's 10pt spacing before it survived.
    # iOS centres a toolbar item's content in its own glass backing, so what was
    # being centred was mark-plus-gap-plus-nothing: 5pt left of the middle.
    #
    # And `offFill` - the DISABLED plate - was still near-black in light theme,
    # the same inversion 73 fixed for the face. DeadPlate is shared with the
    # icon button, so a disabled send arrow was a black disc on a white page.
    #
    # 75: the settings button has no plate of its own. iOS draws a glass capsule
    # behind every toolbar item - it is what the mark on the left sits in - so
    # giving the gear `.icon` as well put the component's machined metal face
    # INSIDE that capsule. Two nested surfaces, a grey disc in a white one. The
    # leading item looked right for exactly the reason this one looked wrong: it
    # brings no surface of its own. GlassyIconStyle stays where a glyph has to
    # supply its own affordance, like the send arrow on the compose line.
    #
    # 76: the speaker engine is actually linked, and the recognizer knows its
    # own name. SpeakerTagger.swift, VoiceEnrollView.swift and a 25MB
    # embedding model have shipped in every build while the target's
    # packageProductDependencies was an EMPTY LIST - the code that runs them
    # could never load, so speaker stayed blank on every event. And both
    # recognition request sites now hand SFSpeechRecognizer contextualStrings
    # (AnticipyVocabulary.swift): the shipped model heard "anticipy growth
    # ... dot com" as "anticipate growth there's something.com" and she
    # offered to buy the misspelling of her own product.
    #
    # 77: the phone finally says what listening costs, and the number stops
    # lying about which bytes it describes.
    #
    # This setting sat at 76 across NINETEEN iOS commits. Seven different source
    # trees all called themselves build 76, so "is that bug still in the build
    # on your phone?" had no answer, and two research passes hit exactly that as
    # an obstacle in one night. App Store Connect refuses a re-used build
    # number, which is the only reason it was ever noticed at all — days after
    # the tree it should have described. `Tests/run_build_number_tests.sh` now
    # fails when the iOS source has moved since this line last did, so the
    # reminder arrives while the change is still being written rather than at
    # upload.
    #
    # And the battery. An always-on microphone, a speech recognizer and a
    # 4-second watchdog are a real draw, and nothing in this product had ever
    # measured one — so the two costs removed this week (a call minting an
    # SFSpeechRecognitionTask every four seconds for its whole length, and the
    # journal writing fifteen identical lines a minute through an outage) were
    # both argued about with no number attached to either. The Listening screen
    # now reports what was spent and over how long, with time on a charger
    # excluded and said out loud. No threshold, no verdict: there is no measured
    # drain in this repo to draw a line from, and a rule written while the sense
    # is unmeasured is tape by Law 5's definition.
    #
    # 78: the echo guard stops judging duplicates by elapsed time. Every line
    # leaves the phone either on a partial or one utterance gap after the last
    # one, so two lines the silence timer delivers are ALWAYS further apart
    # than the gap — a recognizer re-rendering an utterance and a person saying
    # it again alike. Both floors measured at 2.61s through the real cursor, so
    # no width of window ever separated them: twelve seconds ate the tester's
    # second attempt, 2.6 let the recorded 2026-08-17 duplicate back on the
    # feed. It is armed on the cursor's LINEAGE BREAK instead, which is a fact
    # the phone already held and never passed on, and the three word-similarity
    # thresholds that decided whether the owner's words reached the system at
    # all (law1-audit #54) are gone with it.
    #
    # 79: the session-facts line stops being a mutable String. It was
    # `var facts = "…"` with a `+=` under it inside an 1,100-line file, and the
    # only thing between it and an exportable log was a text scan reading every
    # line that gave it a value. A reviewer wrote two working leaks past that
    # scan — `self.facts += self.partial`, which the scan could not see through
    # the `self.`, and `(facts, lastSessionFacts) = (self.partial, "")`, a shape
    # it did not recognise and therefore read as harmless. It is a
    # `ListenSessionFacts` now: no `+=`, no `.append`, no tuple assignment that
    # compiles at all.
    #
    # 80: and the scan that read that construction argument by argument is GONE,
    # because a fifth review pass wrote eight more leaks past the layer beneath
    # the rules — the finder, the derivation, the allowlist. ListenEvent now
    # declares no String payload at all: a flush reason, a post detail, the
    # session facts and the dropped-buffer count are Ints, Bools and closed
    # enums, and describe() chooses every word that reaches disk. The gate asks
    # whether the payloads are closed instead of which strings to chase.
    #
    # 81: sherpa-onnx unlinked again. Builds 76-80 delivered ZERO rows to
    # production; 75 delivered 313 and stopped at the minute it was replaced.
    # 81 was the first build since 75 without the speaker frameworks.
    #
    # 82: and 82 is the one to install, because three more source files landed
    # after 81 was set (the receipt column AgentJob now decodes, and the two
    # sign-up screens that put a dialling code in the field). 81 and 82 are not
    # the same app, and "which build are you holding" has to keep having an
    # answer — that is the whole reason this number is gated. The experiment is
    # unchanged and now rides on 82: it is still the first build since 75
    # without the speaker frameworks, so a row from it says the linkage was the
    # cause, and silence from it says look at the session instead.
    # 83: the three stranger-gate legs that were in this tree.
    #
    # The tour belongs to the ACCOUNT. `hasOnboarded` was one boolean for the
    # whole phone and nothing in the account lifecycle touched it, so a
    # stranger handed a phone anybody had already opened this app on signed up
    # and landed straight on the feed — no microphone primer, listening never
    # started, nothing heard all week. Cable install is the only way onto a
    # device today, so a previously-used phone is the NORMAL case.
    # FirstRunOwnership decides it at sign-in and the pre-upgrade flag is
    # adopted rather than cleared, so no existing owner redoes first run.
    #
    # Enrolment is OFFERED. It had exactly one presentation site — a sheet
    # three scrolls down in Settings — which is why `speaker` is 0% across 221
    # production events with the cause recorded as "enrollment unreachable".
    # First run now raises the invite once the four beats are cleared. IT DOES
    # NOT DO SO IN THIS BUILD: sherpa-onnx is still unlinked, so
    # SpeakerTagger.available is false, EnrollmentOfferPolicy answers `.cannot`
    # and nothing is shown — twelve seconds of reading that cannot produce a
    # profile is worse than not asking. Re-link the engine and the invite is
    # already standing in front of every new person. `speaker` stays at 0%
    # until then, and no amount of onboarding moves it.
    #
    # And the done card shows the RECEIPT. The backend has refused to mark any
    # job done without `verified: true` and non-empty evidence since
    # workflow_guard.pb.js:662, and the app rendered `result` — free text the
    # browser composed about its own success — while the evidence the server
    # checked sat unread in the same row. `hasReceipt` now means the server
    # verified this, bound to the row's own effect_key, and the proof index is
    # on the card. Moment 31: done without proof doesn't exist.
    # 84: the pendant stops sending sound off the phone, and the app stops
    # telling its owner that it does.
    #
    # design/LOCAL-FIRST.md rule 1, first in the list: "RAW AUDIO NEVER LEAVES
    # A DEVICE. Not to Deepgram, not to anyone." That law was written and then
    # the product streamed the pendant's raw Opus frames to a speech vendor's
    # websocket for months, while LOCAL-FIRST.md's own scoreboard said the
    # phone did all processing and was "law-abiding by design".
    #
    # TranscriberClient.swift is deleted, the token exchange is gone from
    # AnticipyBackend, and startPendantTranscription leaves `onOpusFrame` nil
    # so frames are dropped where they arrive. It cost nothing that worked:
    # production events with source="pendant" is ZERO, ever, against 229 from
    # the phone microphone.
    #
    # AND THE COPY. Three sentences told the owner their pendant audio went to
    # a named vendor; two more promised a stream that was "starting" or "not
    # live yet". Once the lane closed all five were FALSE, and a false privacy
    # promise is worse than the violation it described — it says audio goes
    # somewhere it does not, and nothing about where it went instead. They are
    # rewritten, not deleted: silence where a promise was is its own failure.
    #
    # THE PENDANT IS MUTE UNTIL AN ON-DEVICE TRANSCRIBER EXISTS, and that is
    # said on both screens that mention it. LocalTranscriber.swift is 43 lines
    # with zero call sites and wants AVAudioPCMBuffer while the pendant emits
    # Opus Data, with no Opus decoder in the target. That decoder is the real
    # work and it is NOT started here.
    #
    # 85 — declared the phone-side answer-ending classifier as TAPE.
    # It was later retired: every typed answer now reaches Conversation.on_reply
    # as one app_reply, and the brain's offline path can cancel needs_user work.
    # 86: the app carries a decision about phone calls for the first time.
    #
    # `Audio/CallPresencePolicy.swift` folds CallKit's call list and the clock
    # into three answers: whether a call has the microphone, when to stop
    # fighting for it and when to try again, and where the conversation
    # boundaries were. A call is a hole in the day where the ears go deaf, and
    # until now that hole was indistinguishable from silence — `suspended` says
    # the microphone is gone and never why, never when, never whether it is over.
    #
    # NOT THE RECORDER THE CARD ASKED FOR, and it never can be: no third-party
    # iOS app can record the audio of a phone call or a FaceTime, which is
    # refused by the OS and already measured in this tree as the 0 Hz guard at
    # PhoneListener.swift:439. docs/superpowers/specs/2026-08-25-ios-call-recorder.md
    # carries the sources; research/2026-08-25-call-detection.md carries what
    # detection alone buys and what the card has to be re-scoped to.
    #
    # THE BYTES MOVE AND THE BEHAVIOUR DOES NOT. The policy compiles into the
    # binary and nothing calls it yet: the CXCallObserver adapter that would feed
    # it is the next step, and it is named as owed rather than implied to be
    # done. This number moves because the bytes did, which is the whole rule.
    # 87: the same policy after an adversarial pass at it, which found two
    # things and is the reason law 6 exists.
    #
    # A call DISPLACED by call waiting closes its stretch of conversation while
    # still being live, and a consumer reading that close alone would fire a
    # post-call prompt at somebody in the middle of the call they just switched
    # to. The `Action` in the same verdict already distinguished them; nothing
    # said so, and now the case says it and a sweep leg holds it.
    #
    # And `seenLive` replaces a set that tracked only calls seen RINGING, which
    # could not vouch for a call displaced and later resumed — the flag lying in
    # the safe direction is still the one field that exists to say how much to
    # trust the floor being wrong. The wider set is also the simpler one.
    #
    # 86 exists in history and is not these bytes.
    #
    # 89: the Bluetooth permission string still told the owner "pendant audio is
    # sent to Deepgram for live transcription", five hours after that path was
    # deleted from both server and client. That sentence is what iOS renders at
    # the prompt, so it is the one a person actually reads before deciding — and
    # a false privacy promise is worse than the practice it describes. Info.plist
    # only; no code changed, which is exactly why the build number has to move:
    # 88 is already installed on a phone and says something different.
    # 90: the phone can decide what to do with a calendar errand, and the
    # Bluetooth sentence stops coming back from the dead.
    #
    # `Backend/CalendarHandPolicy.swift` is rung 0 of
    # research/2026-08-26-hands2-better-answer.md: the app already holds full
    # calendar access and already polls the job channel every three seconds, so
    # what was missing was never plumbing, it was a DECISION. The policy is pure
    # Foundation — no EventKit, no store, no clock of its own — so "what will
    # the hand do with this job" is answerable on a laptop.
    #
    # WHAT MAKES IT LEGAL, and it is the whole reason the type exists.
    # docs/superpowers/specs/2026-08-24-shelf-2-redesign.md §4: "An act is
    # admissible only when undoing it requires nothing the act produced."
    # EKEvent.eventIdentifier is assigned BY EVENTKIT ON SAVE, so an undo that
    # looks it up is exactly the shape §6.1 excludes by name. So the id is
    # MINTED BY US before the act, rides on the event's `url`, and the undo is a
    # SEARCH for our own id — never a lookup of theirs. It rides on `url` and
    # not on `notes` because the permission string the owner already read says
    # "She never reads the notes or the invitees", and an undo that searched
    # notes would read the notes of every event in its window.
    #
    # THE BYTES MOVE AND THE BEHAVIOUR DOES NOT. Nothing calls the policy yet:
    # the EKEventStore executor behind it is NOT written, deliberately, because
    # a calendar write is not in the admitted set (brain/workflow.py
    # ADMITTED_ACT_TYPES has one member and it is `local_draft`) and §10.1's
    # conditions 2, 3 and 6 are unmet. `admittedForActAndTell` is EMPTY: this
    # hand refuses to move without the server's own approval record bound to the
    # exact plan version, so it carries no second copy of the confirmation gate.
    #
    # And the Bluetooth permission string. Build 89 fixed it in Info.plist and
    # not in project.yml, which is the file `xcodegen generate` writes FROM — so
    # adding any source file resurrects the vendor sentence. Fixed at the source
    # this time. See the note on the key itself.
    #
    # 91: the trust-tier UX pass, five source files in one tree and none of them
    # compiled together until now. Sign-out stopped leaving the last owner's
    # name and email on the screen for whoever signs in next; a stop you tapped
    # stopped taking its own warning away with it; a half-typed number under
    # Save stopped saying nothing at all; a stopped card now says it stopped.
    # Every one of those is a sentence a person reads and believes, so build 90
    # and these bytes disagree about what the app told somebody about their own
    # account. That is the reason the number moves even though no feature was
    # added.
    #
    # 92: the rest of the mobile UX audit
    # (research/2026-08-25-mobile-ux-audit.md) — first run, home, Settings, the
    # context ask and the diagnostics screen, written by separate agents in one
    # tree and compiled together for the first time here. What moved is what
    # the screens SAY. Settings stopped telling somebody two false things about
    # themselves, and its one measured number is a value now rather than a
    # sentence. Home says what it counted — the queue, the answers, the
    # silence, the sample — and the interruption line names the silence it
    # measured, not an age nobody took. First run counts the account it has
    # just made, confirms what it already holds, and ends three ways. The ask
    # names what a yes buys, and a yes shows what it took. PlainDuration is a
    # new file because three screens were about to say the same seconds three
    # different ways; it has exactly those three callers. CalendarHandPolicy
    # gained the clauses that refuse a row the gate never saw — bytes only, it
    # still has no call site and no executor, exactly as at 91.
    #
    # Same reason the number moved at 91: every one of these is a sentence a
    # person reads and believes, so build 91 and these bytes disagree about
    # what the app told somebody about their own account.
    #
    # 93: build 92's note above says first run "ends three ways". It did not.
    # `FirstRunEnding` was written, compiled and tested at 92, and nothing
    # called it: the call site passed neither fact, a trailing closure bound to
    # the last parameter, both facts fell back to their defaults and every
    # ending collapsed to the one sentence the type existed to stop. So build
    # 92 still says "Give me a day. You'll see." to somebody who declined the
    # microphone, and Home contradicts it on the very next screen. 93 is the
    # first build where that sentence is chosen rather than assumed.
    #
    # Also at 93: the last beat stopped re-sending a name and email the account
    # already held, which on a bad connection held a person at the final page
    # of first run under a save failure over their own saved email.
    #
    # The bytes that moved are otherwise comments — but they are the comments
    # this repo navigates by, and six of them cited line numbers that pointed
    # at unrelated code, five of those wrong on the day they were written. One
    # stated as fact that `permissionDenied` latches when it is a computed
    # property doing three live reads. A comment that misdirects the next
    # reader is a defect in a codebase whose first rule is to read the comment
    # above the line, so 92 and these bytes disagree about that too.
    # 94: the sign-in door is no longer the first thing the product says. A
    # stranger used to type an email, a password AND a phone number before the
    # app had produced one single thing of its own; the two beats that ask for
    # nothing — the introduction, and how she works — happen in front of the
    # door now, and the door stops saying "I'm Anticipy." a second time after
    # the welcome beat has already said it. What sits behind the door is
    # unchanged, deliberately: the microphone primer may not move, because
    # `heard` attempts a live push before it queues and a microphone running
    # before an account exists posts a stranger's room to the server.
    #
    # A person can now be in three states no build before this one had: they
    # can force-quit between the introduction and the door, hand the phone to
    # somebody who signs into their own account halfway through, or reinstall
    # onto an account that already exists. `FirstRunRoute` decides all six
    # states and `hasSeenIntro` is what makes the first of them survive a
    # relaunch — so 93 and these bytes disagree about which screen a launch
    # opens on, which is the largest thing a build number can disagree about.
    #
    # 95 is the repair of 94, and it is a routing change rather than a wording
    # one, so it needs its own number: on 94 an owner who signed out was sent
    # into the NEW-USER introduction, because `hasSeenIntro` is a key that did
    # not exist when their tour was walked and nothing stamps it retroactively.
    # 95 reads a completed tour on the handset as proof the introduction was
    # given on it, so 94 and these bytes disagree about which screen a signed-out
    # launch opens on — again the largest thing a build number can disagree
    # about. The microphone still may not move, and on 95 the suite reads the
    # page map and the beat guard that keep it where it is rather than assuming
    # them.
    #
    # 96 lands the settings design system Jose asked for from seven supplied
    # screens: SettingsKit's chrome, card, section, footnote and eight row
    # variants. Nothing on screen has moved yet — no view consumes it in this
    # build — so 95 and these bytes agree about every pixel a person can reach.
    # It gets its own number because the file list changed: this project globs
    # `sources: - Anticipy`, so two new files enter the target here, and a
    # number that did not move would let a build with the library and a build
    # without it wear the same name while the next commit starts deleting the
    # 968-line Form they replace.
    #
    # 97 is the first screen built on the library 96 landed: "What I can see"
    # stops printing every source expanded — name, promises, revoke, watch, for
    # each of three — and becomes a list of sources wearing their answer, with
    # the promises one tap in. 96 and these bytes disagree about what that
    # screen shows, which is a person's own question about what she may read.
    #
    # 98 is screen 4: Profile. Name, email, birthday and number on one screen
    # with ONE confirm control -- a circular header button, greyed until there
    # is something to save -- where 97 had two Save buttons in two sections and
    # a person who edited both had to find both. 97 and these bytes disagree
    # about where the control that writes to the server is, which is the largest
    # thing a build number can disagree about on an editable screen.
    #
    # 99 is the last two of the seven screens: Listening, and the Settings root
    # that now opens when anyone taps Settings. The pause durations came out of
    # a Menu and onto the screen as a pick-one group, so a person no longer taps
    # to find out what the choices are, and the root gained the identity pill,
    # the appearance picker and the About sheet. 98 and these bytes disagree
    # about which view the Settings row opens at all, which is as large as a
    # build-number disagreement gets short of the app not launching.
    #
    # 100 changes the audio session category, which is the largest thing on
    # this list and the one to look at first if a build behaves strangely.
    # `.record` is exclusive: any other app playing audio interrupted her, the
    # engine stopped, and the background assertion -- worth roughly thirty
    # seconds -- was all that kept the process alive, so a YouTube video left
    # running meant she stopped listening and was eventually suspended. That is
    # the "crashes when media plays" report. `.playAndRecord` + `.mixWithOthers`
    # is the only combination that lets her keep an input while another app owns
    # playback, and `.mixWithOthers` is REFUSED on `.record`, so this is a
    # category change or it is nothing. `.defaultToSpeaker` rides with it
    # because `.playAndRecord` otherwise routes output to the receiver and
    # somebody's music would jump to the earpiece.
    #
    # 100 also gives CallPresencePolicy its first call site. It shipped correct
    # and inert -- 44 checks, zero callers -- and CallSense is the CXCallObserver
    # adapter that ends that. 99 and these bytes disagree about whether the app
    # knows a call is happening at all.
    #
    # 101 makes the supplied screens exact where they were only structural.
    # Jose asked for them "EXACTLY AS THAT", so the controls -- toggle, tick,
    # checkmark, selected ring -- take the system blue every iPhone owner reads
    # as switchable, and the sheet title takes bold sans rather than the serif.
    # A new token, Theme.systemControl, keeps that separate from Theme.accent:
    # accent is the BRAND and is still champagne, this is the colour of a
    # CONTROL, and merging them would mean restyling the brand silently
    # restyles every switch in the app.
    #
    # 102 removes the second back button. SheetChrome draws its own circular
    # leading button and every screen using it is PUSHED onto a NavigationStack
    # that draws one too, so 101 shipped a system chevron sitting directly above
    # a circle doing the same job. Hiding the SYSTEM bar rather than our own
    # button is what the supplied screens do -- their header is the whole
    # chrome, the title centres against it, the trailing control shares the row
    # -- and reclaiming the bar's space is what lifts that row into it.
    # 103 was built on Jose's machine from these bytes and pushed no further —
    # it exists in TestFlight and nowhere in git, which is the drift the CI
    # below exists to end.
    #
    # 104: the first build the REPO produces. `.github/workflows/ios-testflight.yml`
    # archives on Xcode 26 with cloud signing (Apple holds the key; the ASC API
    # key authorizes it) and uploads to TestFlight on every push to the
    # branch — no laptop holds the certificates any more. agvtool bumps past
    # Apple's latest at build time, so CI uploads can never collide with a
    # local one.
    #
    # 105: the ears upgrade and the gap law, in one number because they ship
    # together. iOS 26's SpeechTranscriber becomes the listening engine
    # wherever the device has it (2.12% word error against the legacy
    # recognizer's 9.02%, still entirely on device) behind
    # `ListenEnginePolicy`, with a Settings escape hatch back to the legacy
    # recognizer. The BLE gap law lands with it: the assembler measures
    # airtime the radio lost, `GapMarker` renders it as "[unavailable 4m
    # 32s]" in the feed, and no recognizer is ever handed silence to speak
    # through. New files: SpeechAnalyzerEngine, TranscriptionEnginePolicy;
    # PhoneListener's request seam, LocalTranscriber's engine dispatch, the
    # assembler's gap ledger, and the tests that pin all of it.
    #
    # 106: the widget that rings the doorbell. A Lock Screen / home tile
    # (AnticipyWidget target) taps through the anticipy URL scheme and the
    # app's onOpenURL hands the tap to startListening — permission prompts,
    # the account gate, everything the feed's own button does, without the
    # walk to the app first. The scheme is registered on the app target's
    # info properties; the extension target embeds here, so the file list
    # changed — which alone would move the number.
    # 107: the Mac ear joins the day. Settings' "Your computer" section
    # gains the download row for Anticipy-for-Mac (served from the same
    # backend that serves the extension), and the Mac app itself lands in
    # app/macos/AnticipyMac — menu bar, meeting detection through
    # MeetingOfferPolicy's own law (offer first, recording only on the
    # owner's click), on-device SpeechTranscriber, and transcripts posted
    # with the same capture envelope the phone sends. 106 and these bytes
    # disagree about what a signed-in phone offers its owner.
    # 108: the automated consumer walk now reaches and proves every page it
    # names, and the two defects it exposed were repaired.
    # 109: Settings becomes a real page hierarchy. Connectors have individual
    # detail pages, Appearance and Advanced stop changing things from the
    # index, notifications gain quiet-hour controls, ambient motion and
    # haptics are configurable, and the looping Home dots are removed.
    # 110: the browser connector's last-seen age uses the same shared duration
    # language as every other screen instead of showing placeholder arithmetic.
    # 111: route recovery retires the old audio engine instead of reinstalling
    # a tap on its input node, and a narrow Objective-C boundary turns any
    # transient AVFAudio tap exception into a retry instead of an app crash.
    # 112: first run now hands browser and Mac setup to the computer through
    # hosted Railway pages and the native iOS share sheet. Browser setup shows
    # its live six-digit code and linked receipt on the hosted page; the Mac
    # path opens a real install guide instead of downloading a ZIP to an iPhone.
    # 113: Home's breathing dot and three waveform bars no longer use broad
    # repeatForever transactions that can capture ScrollView layout changes
    # and wander across the screen. Their scale is derived from an animation
    # timeline, so their positions are structurally constant.
    # 116: a draft calendar request now asks for its missing time instead of
    # presenting a dead "Send it" approval, approval and answer taps route to
    # their distinct server paths, and first run states plainly whether alerts
    # stay in-app or also arrive by text. Builds 114 and 115 were already used
    # by the cloud release of source build 113, so this source identity starts
    # above both of them.
    # 119: Home becomes a calm consumer surface: raw speech moves behind
    # authenticated developer diagnostics, Done becomes a swipeable receipt
    # deck, and brain-authored insights replace transcript chatter. Actions are
    # app-first and recoverable after response loss, account switches cannot
    # inherit stale refreshes or alerts, phone removal fails closed at every
    # delivery boundary, and independent profile saves merge atomically on the
    # authenticated account. Builds 117 and 118 were consumed by the cloud
    # release pipeline while this source work was in progress.
    # 120: replacement speech windows receive fresh capture starts instead of
    # collapsing several transcript rows onto one old instant, and every typed
    # answer reaches the brain instead of a phone-side keyword classifier.
    # 121: the Release build is warning-clean for its audio changes: the audio
    # route uses the current Bluetooth HFP option and analyzer callbacks no
    # longer carry mutable weak captures across concurrency boundaries.
    # 122: capture loss stops being silent. Airtime the pendant's radio lost
    # was already measured by OpusFrameAssembler and thrown away when the
    # process ended; it is now a journal event a day folds into two numbers.
    # The unsent queue, which had no bound at all, is bounded at 2000 lines
    # keeping the newest, and what falls off is recorded rather than dropped
    # quietly.
    # 123: a queued line leaves the phone's disk only after the server has
    # confirmed it. The flush used to empty the durable queue before posting
    # anything, so iOS suspending a backgrounded app mid-flush lost every
    # unposted line with no counter and no journal entry.
    # 124: after a crash the retry cites what the extension found on the
    # surviving page (params._reconciliation) and refuses on the phone for
    # every verdict but not_applied, instead of writing a constant the DB
    # guard could not tell from a finding (audit #90 E). The Listening
    # screen shows the day's delivered lines by ear, and a line sent from
    # the queue keeps its ear in the journal. A battery reading is written
    # with every start and stop line so the measured window is closed, and
    # drain per hour rides beside it — no threshold anywhere.
    # 125: expectedExtensionVersion is 0.14.0, so the stale-extension nag
    # tracks the extension that defaults to api.anticipy.ai (`5f4ccec6`).
    # 124 was never built by anyone: the pin moved in AnticipyApp.swift four
    # and a half hours after the number was set, so the tree carried the
    # build-number leg red and the ledgers described bytes that had no build
    # (audit F21, 2026-09-05). No 124 exists on App Store Connect; this is
    # the first build off cloudflare-backend, and it uploads as 125 because
    # the workflow now keeps the source number unless Apple holds it (F22).
    # 126: expectedExtensionVersion 0.14.0 -> 0.15.0, so the stale-extension
    #      banner stops telling a stranger to Reload for a version nobody
    #      serves (stranger_gate leg 1).
    # 127: StaleExtensionTests.swift mirrored the pin as 0.14.0 while the app
    #      said 0.15.0 — a mirror testing a comparison the app never makes.
    #      App behaviour is identical to 126.
    # 132: ConnectedAppsClient.swift is untracked again. 128 committed it to
    #      make the LOCAL build see it, but the ConnectHandoff half it calls is
    #      still in another session's working tree, so the runner archived a
    #      file whose dependency does not exist in the repo.
    # 131: the dashboard's day headings read the reference time they are
    #      given rather than the device clock, so "Today" means today on the
    #      phone reading it and the suite can be pinned to an instant.
    # 130: a setup card walked past is a SKIP again — recordDecline stopped
    #      writing it down as a refusal of the app and stopped climbing the
    #      ladder, which the server turns into permanent silence at level 1.
    # 129: the conversation dashboard. Home is a thread you read rather than
    #      eight stacked sections, with the capture moment as the face it
    #      wears while she listens, and History behind the title. Also: the
    #      anticipy://listen doorbell can no longer start a microphone before
    #      an account exists.
    # 128: the Mozi-style first run. Welcome, tour, sign-up as three stepper
    #      pages, the name / computer / may-I-listen beats, the champagne
    #      finale, three tips over Home with a coach mark on Listen, and the
    #      four-second dot-to-mark opening in front of it all. Also the
    #      Claude-style Settings home and the Connect page (0d7e37ba).
    # 133: the Connections feature reaches the phone. Settings gains
    #      "Connected apps" backed by a REAL client (ConnectedAppsClient),
    #      the connect handoff opens in ASWebAuthenticationSession, and the
    #      onboarding step asks which apps somebody lives in. None of this
    #      was in any build before now: 127 predates all of it, so the phone
    #      half has never been exercisable.
    # 135: History was empty over a phone full of conversations — the store
    #      writes "2026-09-06 11:43:07.000Z" and the parser wanted a T. Also:
    #      the capture moment shows the lines as they are heard, and History
    #      reads real segments instead of an empty array.
    # 134: 133 would have refused every link it asked for. ConnectHandoff's
    #      allowlist named only the apex while the Worker mints on
    #      api.anticipy.ai, so ConnectedAppsClient threw .linkNotOurs on a
    #      correctly minted link, every time. Both hosts are ours and both are
    #      allowed now; the three subdomain refusals that were doing the real
    #      work are pinned separately.
    # 141: build 140 shipped a run_all.sh that ran a script not in the repo, so
    #      CI exited 127. The reference is out until the commit that adds the
    #      script puts it back.
    # 140: insights. The "Done" heading becomes a card — days you've talked,
    #      and the catch ratio with its denominator — opening a page of what it
    #      adds up to. Three of the metrics originally asked for did not survive
    #      the research: a streak (it would break on this app's own outage), a
    #      weekday chart (it profiles the person, not the work) and recurring-
    #      meeting recaps (law 1: it needs a capitalisation regex).
    # 139: "Which apps do you live in?" is on somebody's first run. The step —
    #      OnboardingConnectStep.swift, the Connections spec's page 45 — was
    #      written, compiled into the target and tested with 154 checks on
    #      2026-09-05, and had ZERO CALL SITES: the beats were welcome / tour /
    #      name / computer / pendant / mic and none of them was it, so the
    #      product asked nobody. It is now FirstRunBeat.connect, between the
    #      pendant and the microphone — the microphone stays last for the reason
    #      the route header gives. Skip is a seven-day SOFT SNOOZE and not a
    #      decline (a decline would raise the server's own threshold to 0.8 and
    #      silence every trigger that carries evidence), the search box hands
    #      the typed words to the catalog unread, and the step is not shown to
    #      somebody who already connected something — while a list that could
    #      NOT be read shows it, because a failed request is not an answer.
    # 138: the pendant's own light breathes in its microphone hole — the glow is
    #      anchored to the hole's real coordinates in each render, found by blob
    #      analysis rather than by eye. Also "Why Bluetooth?" before iOS asks,
    #      and a device identifier so two pendants in one room can be told apart.
    # 137: the pendant's beat. One screen almost everybody walks past —
    #      "Continue without one" is the PRIMARY, owning one is the quiet
    #      second line — with wake / look / pair / wear behind it. It sits in
    #      front of the microphone beat, which stays last for the reason the
    #      route header gives. Hero images generated from the prototype photos.
    # 136: the stale-extension banner stopped telling anybody what to do.
    #      It had moved out of ContentView.swift and been rewritten down to
    #      "Update the browser extension. Installed version: 0.8.3." — the
    #      problem named and then abandoned: no place to go, nothing to press,
    #      and no target version to check yourself against. It names all three
    #      again. tests/test_extension_version_pin.py had been red across five
    #      pushes saying "substring not found", which reads as a rotted test
    #      rather than a regressed banner; it now finds the banner wherever it
    #      lives, so a move reports as a move.
    # 142: "Which apps do you live in?" is IN first run. The Connections spec's
    #      STEP 2 (page 45) was written, compiled into the target and shipped in
    #      builds 133-141 with ZERO CALL SITES -- a screen that existed for
    #      nobody. It is FirstRunBeat.connect now, after the pendant and before
    #      the microphone, because the mic beat is the one that asks iOS for the
    #      microphone and a beat after it would run a microphone while somebody
    #      was still being asked questions. Skip lives inside the step, never a
    #      footer, because page 41 requires it always visible.
    # 143: the same change as 142 -- the onboarding connect step -- renumbered
    #      because 142's number and 142's source landed in two commits. The gate
    #      diffs app/ios/Anticipy against the commit that SET the number, so a
    #      split like that reads as "two different apps call themselves 142",
    #      which is exactly what it is there to catch. Bump and source belong in
    #      one commit; this one is.
    CURRENT_PROJECT_VERSION: "143"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"

# A SHARED scheme, declared here so every machine and any CI gets the same one.
#
# Without this block xcodegen emits no scheme at all (`xcodebuild -list` showed
# "Schemes:" empty), so xcodebuild synthesizes a private one per user. An
# unsigned `build` does not care and succeeds, which is why this looked like a
# reproducibility nicety. It is not: the synthesized scheme's archive action is
# not a Release archive, so `xcodebuild archive` asked Apple for an iOS App
# DEVELOPMENT profile, and the team has no registered devices to mint one from.
# The result was "** ARCHIVE FAILED **" three different ways while the app
# compiled fine — a shipping blocker wearing a signing error's clothes.
schemes:
  Anticipy:
    build:
      targets:
        Anticipy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnticipyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  AnticipyMac:
    type: application
    platform: macOS
    sources:
      - ../macos/AnticipyMac
      - ../macos/Anticipy/Capture/MeetingOfferPolicy.swift
      - ../macos/Anticipy/Capture/CaptureStreamHealth.swift
      - ../macos/Anticipy/Capture/MeetingLinePolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.mac
        MARKETING_VERSION: "1.1.0"
        # LITERAL, and it moves in lockstep with the app's number: the
        # build-number gate reads the shared pbxproj and cannot tell an iOS
        # literal from a Mac one, and two products answering "which build
        # are you holding" with different numbers is the exact disease this
        # gate exists to prevent.
        CURRENT_PROJECT_VERSION: "143"
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../macos/AnticipyMac/AnticipyMac.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: --timestamp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../macos/AnticipyMac/Info.plist
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  AnticipyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Anticipy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Anticipy
        SWIFT_VERSION: "5.0"

  AnticipyWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.app.widget
        # LITERALS, on purpose: run_build_number_tests.sh greps the generated
        # pbxproj for any CURRENT_PROJECT_VERSION that differs from the app's,
        # and a nested "$(CURRENT_PROJECT_VERSION)" reads as exactly that.
        # These move with the app target's numbers, by hand, in the same
        # commit.
        MARKETING_VERSION: "1.1.0"
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CF_DISPLAY_NAME: "Anticipy"
        SWIFT_VERSION: "5.0"
    info:
      # EXPLICIT, not the INFOPLIST_KEY_ shorthand: that build setting does
      # not exist for the extension point, and Apple's validator answered
      # with "Missing Info.plist key. The NSExtensionPointIdentifier key
      # must be present in the NSExtension dictionary" — the bounce that
      # cost build 106's successor its upload.
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Anticipy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Anticipy:
    type: application
    platform: iOS
    sources:
      - Anticipy
    dependencies:
      # The one-tap ear: a widget extension with NO app group, NO AppIntent
      # and NO shared container — the tap opens the app with anticipy://listen
      # (see the URL scheme in info properties) and the app does the rest.
      # Nothing here for provisioning to refuse on a fresh account.
      - target: AnticipyWidget
    # NO DEPENDENCIES, and this is the second time sherpa-onnx has been taken
    # out of this line. Read 9069765a before putting it back.
    #
    # 2026-08-08, commit 9069765a, by controlled experiment:
    #
    #     build 47   SherpaOnnxC.framework + onnxruntime.framework   VANISHED (x2)
    #     build 48   no embedded frameworks, nothing else changed    VALID in 2 min
    #
    # One variable. Builds 46 and 47 uploaded cleanly and then ceased to exist —
    # accepted, then rejected DURING App Store Connect processing, which is the
    # one failure mode that is invisible here: the notice goes to the Apple ID
    # address and ZERO emails from apple.com have ever arrived in the mailbox we
    # can read. That commit concluded "SherpaOnnx stays out", and set a
    # precondition for ever re-adding it: READ THE PROCESSING REJECTION FIRST.
    #
    # Build 76 (commit 6e277694, 2026-08-24 03:48Z) put it back without that
    # rejection ever having been read. It came back as a Swift package rather
    # than as hand-embedded frameworks, but that is the same payload by another
    # route: the resolved pins were sherpa-onnx AND onnxruntime-libs 1.27.1, and
    # onnxruntime-libs is a BINARY xcframework — the identical framework build
    # 47 died carrying. docs/BRIEF.html records the consequence independently:
    # "TestFlight rejects builds with the speaker frameworks silently during
    # processing. Build 76 installs by cable; distribution needs this solved."
    #
    # The last transcript row production ever received arrived at 03:34:24Z,
    # FOURTEEN MINUTES before that commit. Builds 76-80 have delivered zero rows
    # of any kind, ever. That correlation is why this is coming out again; it is
    # NOT proof, and the honest limit is stated plainly: 9069765a's mechanism is
    # a DISTRIBUTION failure, and it explains a build that never reached the
    # phone. It does not explain a build that is running on a phone and not
    # POSTing. Both are still open until somebody looks at the device.
    #
    # WHAT THIS COSTS, so the trade is not silent: on-device speaker
    # recognition. `SpeakerTagger` is behind `#if canImport(SherpaOnnx)`, so it
    # compiles clean without this and `VoiceEmbedderFactory.make()` returns nil.
    # design/LOCAL-FIRST.md wants that feature to exist. Two things say it is
    # not what is being lost today: it was measured on 2026-08-06 as ACTIVELY
    # HARMFUL (195 distinct identities across 200 lines, 97% seen exactly once,
    # the owner recognised twice, Priya's lines tagged as a stranger), and
    # `overnight/stranger_gate.py` leg 5 records speaker at 0% across 221
    # production events with the cause "enrollment unreachable" — the invite is
    # only in Settings, so nobody ever enrolls and the extractor never runs.
    # A feature nothing reaches costs nothing to unlink.
    #
    # PUTTING IT BACK is one `packages:` block and one `dependencies:` entry.
    # speaker-embedding.onnx and PrivacyInfo.xcprivacy are still in the tree, so
    # nothing else has to be rebuilt — but read the Apple ID mailbox first, the
    # way 9069765a asked and 6e277694 did not.
    info:
      path: Anticipy/Info.plist
      properties:
        CFBundleDisplayName: Anticipy
        CFBundleIconName: AppIcon
        # The widget's doorbell. A Lock Screen or home tile taps through this
        # scheme and the app's onOpenURL starts listening — no AppIntent, no
        # App Group, nothing for provisioning to refuse on a fresh account.
        CFBundleURLTypes:
          - CFBundleURLName: ai.anticipy.listen
            CFBundleURLSchemes:
              - anticipy
        CFBundleIconName: AppIcon
        # References the build settings above so the version can never
        # drift: on 2026-08-15 this literal silently overwrote the
        # plist and shipped build 54 twice while claiming 55 and 56.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - audio
        # BUILD 89 FIXED THIS SENTENCE IN Info.plist AND NOT HERE, AND THIS FILE
        # IS THE ONE THAT WINS. `xcodegen generate` regenerates Info.plist from
        # these properties, so the next person to run it — required for any new
        # source file — silently wrote the vendor sentence back on top of the
        # fix. That is where the uncommitted Info.plist change in this tree came
        # from, and it is why `run_build_number_tests.sh` was already red before
        # anything in build 90 was written.
        #
        # The lane it described was deleted from both server and client in build
        # 84. This is what iOS renders at the prompt, so it is the sentence a
        # person actually reads before deciding, and a false privacy promise is
        # worse than the practice it describes.
        NSBluetoothAlwaysUsageDescription: Anticipy connects to your pendant over Bluetooth. The pendant does not transcribe yet — its audio used to be sent to a transcription company, and that was removed because raw audio should never leave your devices. Only needed if you have a pendant.
        # These describe what actually happens: capture continues in the
        # background, and the resulting TEXT is sent to Anticipy's server so she
        # can act on it. The old strings promised "on-device transcription" and
        # referenced a "Local mode" that gated nothing and appeared nowhere.
        # "Anticipy's server" and "her server", not "Anticipy": once the name
        # lost its suffix, "sent to Anticipy so she can act" named the same
        # thing twice in one sentence and read like a bug.
        NSMicrophoneUsageDescription: Anticipy listens through your microphone, including in the background, only while listening is on. Supported iPhones recognize speech on-device; otherwise iOS may use Apple's speech service. The resulting text is sent to Anticipy's server so she can act on it.
        NSSpeechRecognitionUsageDescription: Anticipy uses iPhone speech recognition to turn audio into text. Supported iPhones do this on-device; otherwise iOS may send audio to Apple's speech service. Anticipy sends the resulting text to her server so she can remember it and act on it.
        NSFaceIDUsageDescription: Anticipy uses Face ID only to unlock developer diagnostics on this iPhone.
        # Day zero, the two sources that live on this phone. Both strings say
        # what is actually read, because both are narrower than the permission
        # iOS grants: titles and times for a month, and names with no numbers.
        #
        # BOTH calendar keys ship. iOS 17 split calendar access and deprecated
        # NSCalendarsUsageDescription, but the deployment target here is 16.0
        # and an app linked on 16 WITHOUT that key crashes rather than being
        # refused. Delete it only when the floor moves to 17.
        NSCalendarsFullAccessUsageDescription: Anticipy reads what is coming up in the next month — the title and the time, nothing else — so she knows what you already have on. She never reads the notes or the invitees, and never puts anything in your calendar unless you ask her to.
        NSCalendarsUsageDescription: Anticipy reads what is coming up in the next month — the title and the time, nothing else — so she knows what you already have on. She never reads the notes or the invitees, and never puts anything in your calendar unless you ask her to.
        NSContactsUsageDescription: Anticipy reads the names in your contacts so she knows who you mean when you say one. She never reads a number, an email or an address, and never messages anyone on her own.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Arbitrary loads is gone: everything the app talks to is HTTPS. Local
          # networking stays permitted for a developer pointing at a LAN backend.
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Anticipy/Anticipy-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.app
