name: Anticipy
options:
  bundleIdPrefix: ai.anticipy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "44"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    # Pinned to a revision on purpose: Package.swift landed 2026-07-29 and
    # the newest version TAG (v1.13.4, 2026-07-07) predates it, so from:/
    # exactVersion cannot resolve. Move to `from:` once k2-fsa cuts a tag
    # that contains Package.swift. A branch dep would make builds
    # non-reproducible.
    revision: 00ad9a19a63751a6c4b12050a00eacfeb204814e
targets:
  Anticipy:
    type: application
    platform: iOS
    dependencies:
      # On-device speaker embedding. Static product; nothing to embed.
      - package: SherpaOnnx
        product: sherpa-onnx
    sources:
      - Anticipy
    info:
      path: Anticipy/Info.plist
      properties:
        CFBundleDisplayName: Anticipy
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "44"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSBluetoothAlwaysUsageDescription: Anticipy connects to your Anticipy pendant over Bluetooth. Only needed if you have one.
        # These describe what actually happens: capture continues in the
        # background, and the resulting TEXT is sent to Anticipy's server so she
        # can act on it. The old strings promised "on-device transcription" and
        # referenced a "Local mode" that gated nothing and appeared nowhere.
        NSMicrophoneUsageDescription: Anticipy listens through your microphone, including while the app is in the background, so she can catch what you commit to. Audio stays on your phone; the words are sent to Anticipy so she can act on them. You control when she is listening.
        NSSpeechRecognitionUsageDescription: Anticipy turns what she hears into text on your phone, then sends that text to Anticipy so she can remember it and act on it.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Arbitrary loads is gone: everything the app talks to is HTTPS. Local
          # networking stays permitted for a developer pointing at a LAN backend.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.pendant
