name: Anticipy
options:
  bundleIdPrefix: ai.anticipy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "62"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"

# A SHARED scheme, declared here so every machine and any CI gets the same one.
#
# Without this block xcodegen emits no scheme at all (`xcodebuild -list` showed
# "Schemes:" empty), so xcodebuild synthesizes a private one per user. An
# unsigned `build` does not care and succeeds, which is why this looked like a
# reproducibility nicety. It is not: the synthesized scheme's archive action is
# not a Release archive, so `xcodebuild archive` asked Apple for an iOS App
# DEVELOPMENT profile, and the team has no registered devices to mint one from.
# The result was "** ARCHIVE FAILED **" three different ways while the app
# compiled fine — a shipping blocker wearing a signing error's clothes.
schemes:
  Anticipy:
    build:
      targets:
        Anticipy: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  Anticipy:
    type: application
    platform: iOS
    sources:
      - Anticipy
    info:
      path: Anticipy/Info.plist
      properties:
        CFBundleDisplayName: Anticipy Claude Version
        CFBundleIconName: AppIcon
        # References the build settings above so the version can never
        # drift: on 2026-08-15 this literal silently overwrote the
        # plist and shipped build 54 twice while claiming 55 and 56.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSBluetoothAlwaysUsageDescription: Anticipy Claude Version connects to your pendant over Bluetooth. When it is connected, pendant audio is sent to Deepgram for live transcription. Only needed if you have a pendant.
        # These describe what actually happens: capture continues in the
        # background, and the resulting TEXT is sent to Anticipy's server so she
        # can act on it. The old strings promised "on-device transcription" and
        # referenced a "Local mode" that gated nothing and appeared nowhere.
        NSMicrophoneUsageDescription: Anticipy Claude Version listens through your microphone, including while the app is in the background, so she can catch what you commit to. Audio stays on your phone; the words are sent to Anticipy Claude Version so she can act on them. You control when she is listening.
        NSSpeechRecognitionUsageDescription: Anticipy Claude Version turns what she hears into text on your phone, then sends that text to Anticipy Claude Version so she can remember it and act on it.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Arbitrary loads is gone: everything the app talks to is HTTPS. Local
          # networking stays permitted for a developer pointing at a LAN backend.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.anticipy.app
