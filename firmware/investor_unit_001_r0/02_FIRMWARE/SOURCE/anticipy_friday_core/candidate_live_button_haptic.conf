# Unit 001 owner2 live-stream candidate configuration.
#
# This keeps the hardened live-audio core and 50 mA application charge
# setting, adds the D7 button and D0 haptic service, and deliberately
# compiles out both microSD and onboard-QSPI audio storage.

CONFIG_BT_DIS_FW_REV_STR="0.9.3-wed-live-bh-owner2"
CONFIG_BT_DIS_HW_REV_STR="XIAO nRF52840 Sense + D7 button + D0 haptic"

CONFIG_OMI_ENABLE_BUTTON=y
CONFIG_OMI_ENABLE_HAPTIC=y
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=n

# One-owner candidate: a virgin unit opens a single 120-second commissioning
# window; the first persistent bond is copied into the controller filter
# accept list on every later boot. D7 remains the deliberate reset path. This
# symbol also compiles the defense-in-depth identity checks in transport.c.
CONFIG_BT_FILTER_ACCEPT_LIST=y

CONFIG_DISK_ACCESS=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_EXFAT=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_SPI=n
