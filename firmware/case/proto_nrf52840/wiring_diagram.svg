<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" font-family="Helvetica,Arial,sans-serif">
  <rect width="1000" height="720" fill="#0c0c0c"/>
  <text x="500" y="40" fill="#c8a97e" font-size="26" text-anchor="middle" font-weight="bold">Anticipy Prototype v1 — Wiring Diagram (XIAO nRF52840 Sense)</text>

  <!-- Battery -->
  <rect x="60" y="120" width="200" height="330" rx="14" fill="#1e1e1e" stroke="#c8a97e" stroke-width="2"/>
  <text x="160" y="150" fill="#f5f0eb" font-size="18" text-anchor="middle" font-weight="bold">LiPo 752042</text>
  <text x="160" y="175" fill="#999" font-size="14" text-anchor="middle">3.7 V · 500 mAh · 8x20x43 mm</text>
  <text x="160" y="195" fill="#999" font-size="14" text-anchor="middle">(protection PCB on cell)</text>
  <circle cx="260" cy="240" r="7" fill="#e74c3c"/>
  <text x="230" y="245" fill="#e74c3c" font-size="15" text-anchor="end">+ (red)</text>
  <circle cx="260" cy="380" r="7" fill="#f5f0eb"/>
  <text x="230" y="385" fill="#f5f0eb" font-size="15" text-anchor="end">− (black)</text>

  <!-- Switch -->
  <rect x="330" y="210" width="130" height="60" rx="8" fill="#1e1e1e" stroke="#888" stroke-width="1.5"/>
  <text x="395" y="235" fill="#f5f0eb" font-size="14" text-anchor="middle">Slide switch</text>
  <text x="395" y="255" fill="#999" font-size="12" text-anchor="middle">SS-12D10 (optional)</text>

  <!-- XIAO -->
  <rect x="540" y="120" width="260" height="330" rx="14" fill="#1e1e1e" stroke="#c8a97e" stroke-width="2"/>
  <text x="670" y="150" fill="#f5f0eb" font-size="18" text-anchor="middle" font-weight="bold">XIAO nRF52840 Sense</text>
  <text x="670" y="172" fill="#999" font-size="13" text-anchor="middle">21 x 17.8 mm · PDM mic + IMU onboard</text>
  <text x="670" y="190" fill="#999" font-size="13" text-anchor="middle">BQ25101 LiPo charger onboard</text>
  <circle cx="540" cy="240" r="7" fill="#e74c3c"/>
  <text x="560" y="245" fill="#e74c3c" font-size="15">BAT+ pad (underside)</text>
  <circle cx="540" cy="380" r="7" fill="#f5f0eb"/>
  <text x="560" y="385" fill="#f5f0eb" font-size="15">BAT− pad (underside)</text>
  <circle cx="800" cy="240" r="7" fill="#3498db"/>
  <text x="790" y="245" fill="#3498db" font-size="15" text-anchor="end">USB-C</text>
  <text x="670" y="430" fill="#666" font-size="12" text-anchor="middle">Charging: plug USB-C (5V). Onboard charger does CC/CV @ ~50 mA.</text>

  <!-- Wires -->
  <line x1="260" y1="240" x2="330" y2="240" stroke="#e74c3c" stroke-width="4"/>
  <line x1="460" y1="240" x2="540" y2="240" stroke="#e74c3c" stroke-width="4"/>
  <line x1="260" y1="380" x2="540" y2="380" stroke="#f5f0eb" stroke-width="4"/>
  <text x="395" y="300" fill="#e74c3c" font-size="13" text-anchor="middle">28 AWG silicone wire, ~35 mm</text>
  <text x="400" y="370" fill="#f5f0eb" font-size="13" text-anchor="middle">direct (never switch the − lead)</text>

  <!-- External flash -->
  <rect x="540" y="490" width="260" height="170" rx="14" fill="#1e1e1e" stroke="#3498db" stroke-width="2"/>
  <text x="670" y="518" fill="#f5f0eb" font-size="16" text-anchor="middle" font-weight="bold">W25Q128 SPI flash (16 MB)</text>
  <text x="670" y="538" fill="#999" font-size="12" text-anchor="middle">for 4–8 h offline audio buffer (v1.1, optional)</text>
  <text x="560" y="565" fill="#9ad" font-size="13">VCC → 3V3        GND → GND</text>
  <text x="560" y="588" fill="#9ad" font-size="13">CLK → D8 (SCK)   DO → D9 (MISO)</text>
  <text x="560" y="611" fill="#9ad" font-size="13">DI  → D10 (MOSI) CS → D7</text>
  <text x="670" y="643" fill="#666" font-size="12" text-anchor="middle">Onboard 2 MB QSPI ≈ 17 min ADPCM audio; 16 MB ≈ 2.3 h; use VAD gating for 8 h+</text>

  <!-- Rules -->
  <text x="60" y="510" fill="#c8a97e" font-size="15" font-weight="bold">Assembly rules (zero-failure):</text>
  <text x="60" y="535" fill="#ccc" font-size="13">1. Tape the cell leads apart while soldering — never let + touch −.</text>
  <text x="60" y="558" fill="#ccc" font-size="13">2. Solder to BAT pads FIRST with battery disconnected/taped; battery joins last.</text>
  <text x="60" y="581" fill="#ccc" font-size="13">3. Kapton tape over BAT pads after soldering; foam pad both faces of the cell.</text>
  <text x="60" y="604" fill="#ccc" font-size="13">4. Check polarity twice with a multimeter before first power-on.</text>
  <text x="60" y="627" fill="#ccc" font-size="13">5. Cell protection PCB stays on the cell. Do not remove the yellow wrap.</text>
  <text x="60" y="680" fill="#666" font-size="12">Wireless charging v2: 2x pogo pins in back lid → 5V + GND pads; magnetic dock. Standard Qi coils (Ø40 mm) do not fit the 25 mm-wide body.</text>
</svg>
