<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; width: 260px; padding: 14px; background: #0d0d12; color: #eee; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; margin-right: 6px; }
      p { font-size: 12px; color: #aaa; margin: 6px 0; }
      code { color: #7ab7ff; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span>Anticipy</h1>
    <p>Connected to your Anticipy backend. Jobs from your pendant run here, in your own browser.</p>
    <p id="status">checking backend…</p>
    <p><input id="key" type="password" placeholder="OpenRouter key" style="width:100%" />
    <button id="save">Save key</button> <span id="saved"></span></p>
    <script src="popup.js"></script>
  </body>
</html>
