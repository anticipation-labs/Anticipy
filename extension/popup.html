<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        width: 280px; padding: 16px; margin: 0;
        background: #0c0c0c; color: #f5f0eb;
      }
      h1 { font-family: Georgia, serif; font-weight: 400; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #252525; }
      .dot.on { background: #c8a97e; }
      p { font-size: 12px; color: #8a8a8a; margin: 10px 0; line-height: 1.5; }
      input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #252525; background: #161616; color: #f5f0eb; font-size: 12px; box-sizing: border-box; }
      button { margin-top: 8px; padding: 7px 16px; border-radius: 999px; border: none; background: #c8a97e; color: #0c0c0c; font-weight: 600; font-size: 12px; cursor: pointer; }
      a { color: #c8a97e; font-size: 12px; }
      #saved { color: #c8a97e; font-size: 12px; margin-left: 6px; }
    </style>
  </head>
  <body>
    <h1>
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
        <rect x="10.5" y="3" width="11" height="26" rx="5.5" stroke="#F5F0EB" stroke-width="2.4"/>
        <circle cx="16" cy="20" r="2" fill="#C8A97E"/>
      </svg>
      Anticipy <span class="dot" id="dot"></span>
    </h1>
    <p id="status">Checking connection…</p>
    <div id="pairbox" style="display:none; text-align:center; background:#161616; border:1px solid #252525; border-radius:12px; padding:10px; margin:10px 0;">
      <p style="margin:0 0 4px;">Pair with your iPhone — type this code in the Anticipy app:</p>
      <div id="paircode" style="font-size:26px; letter-spacing:6px; color:#c8a97e; font-family:Georgia,serif;"></div>
    </div>
    <p id="pairedline" style="display:none; color:#c8a97e;">Paired with your iPhone ✓</p>
    <p>Jobs from your pendant run here — quietly, in an <b>Anticipy</b> tab group, always pausing for your OK before anything is sent.</p>
    <p><input id="key" type="password" placeholder="OpenRouter key" />
    <button id="save">Save key</button><span id="saved"></span></p>
    <p><a href="onboarding.html" target="_blank">Open setup guide</a></p>
    <script src="popup.js"></script>
  </body>
</html>
