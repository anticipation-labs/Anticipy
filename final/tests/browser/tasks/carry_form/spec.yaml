id: carry_form
kind: form_action
commit_boundary: submit          # grader-owned throwaway backend -> full submit is safe
# The harness substitutes the real start URL at run time: the embedded server's
# loopback URL in --selftest, or ANTICIPY_CARRYFORM_URL (a public tunnel to it)
# for a live run (the /agent/run SSRF gate refuses loopback start URLs).
start_url: "{CARRY_FORM_URL}"
max_steps: 20
# LIVE-lane precondition. If ANTICIPY_CARRYFORM_URL is not set the live lane marks
# this task BLOCKED-on-Omar (a public tunnel to the grader is needed) and excludes
# it from the pass/fail denominator, rather than counting it as a FAIL. The
# --selftest lane ignores requires_env and runs the checker fully offline.
requires_env:
  - ANTICIPY_CARRYFORM_URL
task: >
  This page shows a claim token. Read the exact token shown on this page, then
  continue to the form and submit it: enter that exact claim token, set full name
  to "Analyst {NONCE}", choose department "operations", tick the confirm checkbox,
  and submit the claim.
needs:
  - a public tunnel to the grader carry-form (ANTICIPY_CARRYFORM_URL) for the live lane
notes: >
  (D) The multi-step CARRY task — genuinely harder than a one-page fill. The claim
  token is generated by the server and only shown on page 1; it is NOT in the task
  text, so the agent MUST read page 1 and carry the value into the form on page 2.
  The independent postcondition is the strongest kind: the checker re-reads BOTH
  the token the server actually displayed (GET /token) AND the token the server
  actually received (GET /last), and requires them to be equal — so a hand that
  skips page 1 and guesses, or "fills" the DOM without a real trusted submit,
  cannot pass.
